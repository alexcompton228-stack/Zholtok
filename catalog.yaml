      q: "Задержка больше 15 дней. Хотите письменно уведомить, что приостанавливаете работу до выплаты? (законно по ст. 142 ТК, зарплата за это время сохраняется)"
      example: true
    - use: person
  warnings:
    - when: "days_since(due_date) > 330"
      text: "С даты выплаты прошло почти год. В суд по невыплате зарплаты нужно обратиться в течение 1 года (ст. 392 ТК РФ). Не затягивайте."
  template: |
    > {{ 'Бывшему работодателю' if fired else 'Работодателю' }}: {{ employer }}
    > {{ employer_address }}
    >
    > От: {{ fio }}
    > {{ 'бывший работник, ' if fired else '' }}{{ position }}
    > {{ address }}
    > Тел.: {{ phone }}{% if email %}, e-mail: {{ email }}{% endif %}

    # ТРЕБОВАНИЕ
    ## о выплате задолженности по заработной плате и компенсации за задержку

    {% if fired %}В соответствии со ст. 140 Трудового кодекса РФ при прекращении трудового договора выплата всех сумм, причитающихся работнику, производится в день увольнения. {{ date(due_date) }} трудовой договор со мной прекращён, однако окончательный расчёт в размере {{ money(debt) }} руб. до настоящего времени не произведён.{% else %}В соответствии со ст. 136 Трудового кодекса РФ заработная плата выплачивается не реже чем каждые полмесяца в установленные дни. Заработная плата в размере {{ money(debt) }} руб., подлежавшая выплате {{ date(due_date) }}, мне до настоящего времени не выплачена.{% endif %}

    В соответствии со ст. 236 Трудового кодекса РФ при нарушении срока выплаты заработной платы работодатель обязан выплатить её с уплатой процентов (денежной компенсации) в размере не ниже 1/150 ключевой ставки Центрального банка РФ от невыплаченной суммы за каждый день задержки. По состоянию на {{ date(today) }} задержка составляет {{ days }} {{ plural(days, 'день', 'дня', 'дней') }}, размер компенсации — не менее {{ money(comp) }} руб. (ориентировочный расчёт по ключевой ставке {{ key_rate_text }}% годовых; окончательная сумма рассчитывается по ставкам, действовавшим в каждый период задержки).

    Требую незамедлительно выплатить задолженность в размере {{ money(debt) }} руб. и компенсацию за задержку, начисленную по день фактической выплаты включительно.
    {% if suspend %}

    Также уведомляю, что в соответствии с ч. 2 ст. 142 Трудового кодекса РФ в связи с задержкой выплаты заработной платы на срок более 15 дней я приостанавливаю работу на весь период до выплаты задержанной суммы, начиная со дня, следующего за днём вручения настоящего уведомления. За период приостановления работы за мной сохраняется средний заработок (ч. 4 ст. 142 ТК РФ).
    {% endif %}

    В случае невыплаты я обращусь в Государственную инспекцию труда, прокуратуру и суд с требованием о взыскании задолженности, компенсации за задержку и компенсации морального вреда (ст. 237 ТК РФ).

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  vars:
    key_rate_text: "{{ fmt_rate(key_rate) }}"
  after: |
    <b>Как вручить</b>
    1. Распечатайте 2 экземпляра. Один отдайте под отметку о приёме на своём (дата, подпись, должность принявшего). Не берут — заказное письмо с описью.
    {% if suspend %}2. <b>Важно:</b> приостанавливать работу можно только со следующего дня после вручения уведомления. До вручения — выходите на работу, иначе могут оформить прогул. Если работодатель письменно сообщит, что готов выплатить долг, выйти на работу нужно не позднее следующего рабочего дня (ч. 5 ст. 142 ТК РФ).
    {% endif %}
    Компенсация посчитана по текущей ключевой ставке — это ориентир; точную сумму считает бухгалтерия или суд.
    Не заплатили — жалоба в трудовую инспекцию (онлайнинспекция.рф) и суд. Работники не платят госпошлину по трудовым спорам.
  followups:
    - days: 7
      text: "Прошла неделя с требования о зарплате. Заплатили? Если нет — напишите жалобу в трудовую инспекцию через онлайнинспекция.рф или Госуслуги и готовьтесь к суду (срок — 1 год с даты выплаты)."

# ---------------------------------------------------------------------
- id: vychet_plan
  category: nalogi
  title: "План возврата налога: сколько вернут и какие документы нужны"
  button: "Сколько налога вернут"
  price: 390
  verified: false
  filename: "План_налогового_вычета.docx"
  sections:
    - {title: "Год и доход", keys: [year, income]}
    - {title: "Расходы", keys: [types, amt_med, amt_drugs, amt_exp, amt_edu, amt_child, children, amt_fit]}
  track: false
  short: "Лечение, лекарства, учёба, фитнес. Считаем, сколько вернёт государство, и даём пошаговый план с 3-НДФЛ."
  gives: "Расчёт суммы возврата, список документов под ваш случай и пошаговая инструкция подачи 3-НДФЛ в личном кабинете."
  basis: ["Налоговый кодекс РФ: ст. 219 (социальные вычеты), ст. 224 (ставки налога), ст. 78 (возврат налога)"]
  kind: memo
  computed:
    lim_social: "150000 if year >= 2024 else 120000"
    lim_child: "110000 if year >= 2024 else 50000"
    social_sum: "(amt_med or 0) + (amt_drugs or 0) + (amt_edu or 0) + (amt_fit or 0)"
    social_ok: "[social_sum, lim_social] | min"
    child_ok: "[(amt_child or 0), lim_child * (children or 1)] | min"
    base: "social_ok + child_ok + (amt_exp or 0)"
    tax_paid: "ndfl(income, year)"
    refund: "tax_paid - ndfl([income - base, 0] | max, year)"
    refund_capped: "base >= income"
    doc_checklist: "deduction_docs(types, year)"
  questions:
    - key: year
      type: int
      q: "За какой год оплачивали расходы? Вернуть можно за 3 последних года. Если за несколько лет — пройдите отдельно по каждому."
      example: "2025"
    - key: income
      type: money
      q: "Ваш официальный доход за этот год до вычета налога (примерно, в рублях). С него должен был удерживаться НДФЛ."
      example: "900000"
    - key: types
      type: multi
      q: "За что платили? Отметьте всё и нажмите «Готово»."
      options:
        - {v: med, label: "Лечение, стоматология"}
        - {v: drugs, label: "Лекарства по назначению"}
        - {v: exp, label: "Дорогостоящее лечение"}
        - {v: edu, label: "Своё обучение, курсы"}
        - {v: child, label: "Обучение детей, брата, сестры (очно)"}
        - {v: fit, label: "Фитнес, спорт"}
      example: [med, child]
    - key: amt_med
      type: money
      when: "'med' in types"
      q: "Сколько заплатили за лечение за год?"
      example: "60000"
    - key: amt_drugs
      type: money
      when: "'drugs' in types"
      q: "Сколько за лекарства?"
      example: "15000"
    - key: amt_exp
      type: money
      when: "'exp' in types"
      q: "Сколько за дорогостоящее лечение? (в справке клиники стоит код услуги «2»)"
      example: "300000"
    - key: amt_edu
      type: money
      when: "'edu' in types"
      q: "Сколько за своё обучение?"
      example: "80000"
    - key: amt_child
      type: money
      when: "'child' in types"
      q: "Сколько за обучение детей всего?"
      example: "70000"
    - key: children
      type: int
      when: "'child' in types"
      q: "За скольких детей платили?"
      example: "1"
    - key: amt_fit
      type: money
      when: "'fit' in types"
      q: "Сколько за фитнес или спорт?"
      example: "30000"
    - key: fio
      type: fio
      q: "Ваши ФИО (для заголовка плана)."
      example: "Иванов Иван Иванович"
  warnings:
    - when: "year < today.year - 3"
      block: true
      text: "Вычет можно получить только за 3 последних года. За этот год уже не вернуть."
    - when: "year >= today.year"
      block: true
      text: "За текущий год 3-НДФЛ подаётся со следующего года. Возвращайтесь в январе — или выберите прошлый год."
    - when: "income > 2400000"
      text: "Доход больше 2,4 млн ₽: в плане учтена прогрессивная шкала НДФЛ за выбранный год. Если были доходы, которые облагаются отдельно (дивиденды, проценты по вкладам, продажа имущества), точную сумму покажет налоговая."
  template: |
    # ПЕРСОНАЛЬНЫЙ ПЛАН НАЛОГОВОГО ВЫЧЕТА
    ## {{ fio }} · расходы за {{ year }} год

    Это расчёт-ориентир и инструкция, а не налоговая консультация. Точную сумму определит налоговая после проверки декларации.

    ### 1. Сколько можно вернуть

    {% if social_sum > 0 %}
    ~ Лечение, лекарства, своё обучение, фитнес: расходы {{ money(social_sum) }} руб., к вычету — {{ money(social_ok) }} руб. (общий лимит {{ money(lim_social) }} руб. в год на эти расходы вместе).
    {% endif %}
    {% if 'child' in types %}
    ~ Обучение детей, брата или сестры: расходы {{ money(amt_child) }} руб., к вычету — {{ money(child_ok) }} руб. (лимит {{ money(lim_child) }} руб. на каждого, общий на обоих родителей; только очная форма и возраст до 24 лет).
    {% endif %}
    {% if 'exp' in types %}
    ~ Дорогостоящее лечение: {{ money(amt_exp) }} руб., без лимита.
    {% endif %}

    Итого база вычета: {{ money(base) }} руб. Вычет уменьшает доход, с которого считается налог, поэтому возвращается налог с этой суммы — не больше удержанного за год. {% if year >= 2025 and income > 2400000 %}С 2025 года действует прогрессивная шкала: 13% — с дохода до 2,4 млн руб., 15% — от 2,4 до 5 млн, 18% — от 5 до 20 млн, 20% — от 20 до 50 млн, 22% — свыше 50 млн. Доход уменьшается «сверху», поэтому возврат считается сначала по самой высокой из ваших ставок.{% elif year >= 2025 %}При вашем доходе ставка — 13%: повышенные ставки (от 15%) с 2025 года применяются только к доходу свыше 2,4 млн руб. в год.{% elif year >= 2021 and income > 5000000 %}За {{ year }} год ставка — 13% с дохода до 5 млн руб. и 15% с части свыше; доход уменьшается «сверху», поэтому возврат считается сначала по ставке 15%.{% else %}За {{ year }} год при вашем доходе ставка — 13%.{% endif %}

    ### Ориентировочно к возврату: {{ money(refund) }} руб.{% if refund_capped %} (ограничено налогом, удержанным с вашего дохода: {{ money(tax_paid) }} руб.){% endif %}

    ### 2. Какие документы собрать
    {% for line in doc_checklist %}
    ~ — {{ line }}
    {% endfor %}

    ### 3. Как подать 3-НДФЛ (онлайн, бесплатно)
    ~ 1) Зайдите в личный кабинет налогоплательщика на nalog.ru (можно через Госуслуги).
    ~ 2) Проверьте, нет ли предзаполненного заявления на вычет: по расходам с 2024 года клиники, учебные заведения и спортклубы передают сведения в налоговую сами, и вычет можно получить в упрощённом порядке — достаточно подтвердить (ст. 221.1 НК РФ). Вычет за лекарства так не дают — только через декларацию.
    ~ 3) Если предложения нет: «Жизненные ситуации» → «Подать декларацию 3-НДФЛ» → год {{ year }} → заполнить онлайн. Доходы и налог от работодателя подтянутся сами.
    ~ 4) В разделе вычетов выберите социальные вычеты и внесите суммы из справок.
    ~ 5) Прикрепите сканы документов из пункта 2 и подпишите декларацию электронной подписью (её можно бесплатно выпустить прямо в кабинете).
    ~ 6) После проверки декларации (до 3 месяцев) подайте заявление о возврате переплаты на свою карту — в кабинете, в разделе «Сальдо ЕНС».

    ### 4. Сроки
    ~ Декларацию на вычет можно подать в любой момент в течение 3 лет после года расходов. Для расходов {{ year }} года — до конца {{ year + 3 }} года.
  after: |
    <b>Что дальше</b>
    Справки об оплате для налоговой выдают клиника, вуз или спортклуб. Нужно заявление на справку — оно есть в разделе «Налоговый вычет» → «Справка для вычета».

