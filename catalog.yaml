      q: "Вы сейчас клиент этой компании (есть действующий договор, кредит, карта)?"
      example: false
    - key: phone_used
      type: text
      q: "Номер, на который звонят или пишут."
      example: "+7 900 123-45-67"
    - key: spam
      type: yesno
      q: "Звонят или пишут с рекламой?"
      example: true
    - use: person
  template: |
    > Кому: {{ company }}
    > {{ company_address }}
    >
    > От: {{ fio }}
    > {{ address }}
    > Тел.: {{ phone }}{% if email %}, e-mail: {{ email }}{% endif %}

    # ТРЕБОВАНИЕ
    ## об отзыве согласия на обработку персональных данных{% if spam %} и прекращении рекламных рассылок{% endif +%}

    На основании ч. 2 ст. 9 Федерального закона от 27.07.2006 № 152-ФЗ «О персональных данных» (далее — Закон) отзываю все ранее данные мной {{ company }} согласия на обработку моих персональных данных{% if client %}, за исключением данных, обработка которых необходима для исполнения действующего договора со мной или требований законодательства{% endif %}.

    В соответствии с ч. 5.1 ст. 21 Закона требую прекратить обработку моих персональных данных{% if client %} в части, на которую распространяется отзыв согласия{% endif %}, в том числе их передачу третьим лицам, в срок, не превышающий десяти рабочих дней с даты получения настоящего требования.

    В соответствии с ч. 5 ст. 21 Закона в связи с отзывом согласия требую уничтожить мои персональные данные{% if client %} в той же части{% endif %} (обеспечить их уничтожение) в срок, не превышающий тридцати дней с даты поступления настоящего отзыва.
    {% if spam %}

    На номер {{ phone_used }} поступают рекламные звонки и сообщения. В соответствии с ч. 1 ст. 18 Федерального закона от 13.03.2006 № 38-ФЗ «О рекламе» распространение рекламы по сетям электросвязи допускается только при условии предварительного согласия абонента; рекламораспространитель обязан немедленно прекратить распространение рекламы в адрес лица, обратившегося с таким требованием. Требую немедленно прекратить рекламные звонки и сообщения на указанный номер.
    {% endif %}

    О результатах рассмотрения прошу сообщить письменно по указанному адресу{% if email %} или на e-mail {{ email }}{% endif %}.

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  after: |
    <b>Как отправить</b>
    1. Если у компании есть официальный e-mail для обращений по персональным данным (ищите в «Политике конфиденциальности») — отправьте туда скан с подписью.
    2. Надёжнее — заказным письмом с описью на юридический адрес.
    {% if client %}Честно: пока у вас с компанией действующий договор, часть данных она вправе хранить. Но рекламу обязана прекратить.
    {% endif %}
    Обработку должны прекратить за 10 рабочих дней (могут продлить ещё на 5, уведомив вас), данные — уничтожить за 30 дней. Не выполнили — жалоба в Роскомнадзор (rkn.gov.ru), а за рекламные звонки — в ФАС (fas.gov.ru).

# ---------------------------------------------------------------------
- id: dkp_avto
  category: dogovory
  title: "Договор купли-продажи автомобиля между физическими лицами"
  button: "Договор купли-продажи авто"
  price: 290
  verified: false
  track: false
  filename: "Договор_купли-продажи_автомобиля.docx"
  sections:
    - {title: "Автомобиль", keys: [car, year, vin, body_no, engine_no, color, plate, pts_kind, pts_no, sts_no, mileage, keys_count, defects]}
    - {title: "Продавец", keys: [seller_fio, seller_passport, seller_issued, seller_address]}
    - {title: "Покупатель", keys: [buyer_fio, buyer_passport, buyer_issued, buyer_address]}
    - {title: "Сделка", keys: [price, deal_date, city]}
  short: "Продаёте или покупаете машину с рук. Договор для ГИБДД, где всё указано правильно, и памятка: что проверить до сделки."
  gives: "Договор купли-продажи с идентификаторами машины, заверениями продавца о чистоте, ценой прописью и отметкой о передаче денег и машины. В 3 экземплярах."
  basis: ["Гражданский кодекс РФ: ст. 161, 223, 454, 456, 460, 475", "Федеральный закон от 03.08.2018 № 283-ФЗ «О государственной регистрации транспортных средств…»: ст. 8, 18"]
  questions:
    - key: car
      type: text
      label: "Марка и модель"
      q: "Марка и модель автомобиля (как в ПТС или СТС)."
      example: "KIA RIO"
    - key: year
      type: int
      label: "Год выпуска"
      q: "Год выпуска."
      example: "2019"
    - key: vin
      type: text
      label: "VIN"
      q: "VIN — 17 символов из ПТС или СТС. Если VIN нет (бывает у праворульных машин), напишите «отсутствует»."
      example: "Z94C241BBKR123456"
    - key: body_no
      type: text
      optional: true
      label: "Кузов №"
      q: "Номер кузова (если указан в ПТС). Если нет, отправьте «-»."
      example: "-"
    - key: engine_no
      type: text
      optional: true
      label: "Двигатель №"
      q: "Номер двигателя (если указан в ПТС). Если нет, отправьте «-»."
      example: "G4FG KW123456"
    - key: color
      type: text
      label: "Цвет"
      q: "Цвет (как в документах)."
      example: "белый"
    - key: plate
      type: text
      optional: true
      label: "Госномер"
      q: "Государственный регистрационный знак. Если номера сняты, отправьте «-»."
      example: "А123ВС777"
    - key: pts_kind
      type: choice
      label: "ПТС"
      q: "Какой паспорт транспортного средства?"
      options:
        - {v: paper, label: "Бумажный ПТС"}
        - {v: epts, label: "Электронный ПТС (ЭПТС)"}
      example: paper
    - key: pts_no
      type: text
      label: "Номер ПТС / ЭПТС"
      q: "Номер ПТС (серия и номер) или номер электронного ПТС (15 цифр, есть в выписке)."
      example: "78 ОК 123456"
    - key: sts_no
      type: text
      optional: true
      label: "СТС"
      q: "Серия и номер свидетельства о регистрации (СТС). Если нет, отправьте «-»."
      example: "99 01 123456"
    - key: mileage
      type: int
      label: "Пробег"
      q: "Пробег по одометру, км."
      example: "86000"
    - key: keys_count
      type: int
      label: "Комплектов ключей"
      q: "Сколько комплектов ключей передаёте?"
      example: "2"
    - key: defects
      type: long
      optional: true
      label: "Известные недостатки"
      q: "Известные недостатки машины, о которых продавец предупредил (царапины, неисправности). Это защищает продавца от претензий потом. Если нет, отправьте «-»."
      example: "скол на лобовом стекле; царапина на заднем бампере"
    - key: seller_fio
      type: fio
      label: "Продавец"
      q: "ФИО продавца полностью (как в паспорте)."
      example: "Петров Пётр Петрович"
    - key: seller_passport
      type: text
      label: "Паспорт продавца"
      q: "Серия и номер паспорта продавца."
      example: "4510 654321"
    - key: seller_issued
      type: text
      label: "Кем выдан (продавец)"
      q: "Кем и когда выдан паспорт продавца."
      example: "ГУ МВД России по г. Москве, 20.03.2014"
    - key: seller_address
      type: text
      label: "Адрес продавца"
      q: "Адрес регистрации продавца."
      example: "г. Москва, ул. Лесная, д. 3, кв. 7"
    - key: buyer_fio
      type: fio
      label: "Покупатель"
      q: "ФИО покупателя полностью (как в паспорте)."
      example: "Иванов Иван Иванович"
    - key: buyer_passport
      type: text
      label: "Паспорт покупателя"
      q: "Серия и номер паспорта покупателя."
      example: "4510 123456"
    - key: buyer_issued
      type: text
      label: "Кем выдан (покупатель)"
      q: "Кем и когда выдан паспорт покупателя."
      example: "ГУ МВД России по г. Москве, 12.05.2015"
    - key: buyer_address
      type: text
      label: "Адрес покупателя"
      q: "Адрес регистрации покупателя."
      example: "г. Москва, ул. Садовая, д. 1, кв. 10"
    - key: price
      type: money
      label: "Цена"
      q: "Цена автомобиля, в рублях. Указывайте реальную цену — от неё зависят налог продавца и защита покупателя."
      example: "1150000"
    - key: deal_date
      type: date
      label: "Дата сделки"
      q: "Дата подписания и передачи машины. ДД.ММ.ГГГГ."
      example: "-0d"
    - key: city
      type: text
      label: "Место подписания"
      q: "Город или населённый пункт, где подписываете договор."
      example: "Москва"
  warnings:
    - when: "year < 1950 or year > today.year + 1"
      block: true
      text: "Проверьте год выпуска."
    - when: "days_since(deal_date) < -30"
      block: true
      text: "Дата сделки больше чем через месяц. Договор лучше подготовить ближе к дате, когда будете подписывать и передавать машину."
    - when: "true"
      text: "Перед подписанием проверьте машину: залог — reestr-zalogov.ru, ограничения и розыск — гибдд.рф/check/auto. Сверьте VIN на кузове с документами."
  template: |
    # ДОГОВОР
    ## купли-продажи транспортного средства

    = г. {{ city }} | {{ date(deal_date) }}

    {{ seller_fio }} (паспорт {{ seller_passport }}, выдан {{ seller_issued }}; адрес регистрации: {{ seller_address }}), далее — Продавец, с одной стороны, и {{ buyer_fio }} (паспорт {{ buyer_passport }}, выдан {{ buyer_issued }}; адрес регистрации: {{ buyer_address }}), далее — Покупатель, с другой стороны, заключили настоящий договор о нижеследующем.

    ### 1. Предмет договора
    ~ 1.1. Продавец передаёт в собственность Покупателя, а Покупатель принимает и оплачивает транспортное средство (далее — Автомобиль):
    ~ марка, модель: {{ car }};
    ~ год выпуска: {{ year }};
    ~ идентификационный номер (VIN): {{ vin }};
    {% if body_no %}
    ~ номер кузова: {{ body_no }};
    {% endif %}
    {% if engine_no %}
    ~ номер двигателя: {{ engine_no }};
    {% endif %}
    ~ цвет: {{ color }};
    {% if plate %}
    ~ государственный регистрационный знак: {{ plate }};
    {% endif %}
    ~ {% if pts_kind == 'epts' %}электронный паспорт транспортного средства № {{ pts_no }}{% else %}паспорт транспортного средства {{ pts_no }}{% endif %};
    {% if sts_no %}
    ~ свидетельство о регистрации транспортного средства {{ sts_no }};
    {% endif %}
    ~ пробег по показаниям одометра: {{ money(mileage) }} км.
    ~ 1.2. Продавец гарантирует, что Автомобиль принадлежит ему на праве собственности, никому не продан, не подарен, не заложен, в споре, под арестом и запретом не состоит, в розыске не находится и свободен от любых прав третьих лиц (п. 1 ст. 460 Гражданского кодекса РФ).

    ### 2. Цена и расчёты
    ~ 2.1. Цена Автомобиля — {{ money(price) }} руб. ({{ money_words(price) }}).
    ~ 2.2. Покупатель передал, а Продавец получил денежные средства в сумме, указанной в п. 2.1, полностью при подписании настоящего договора. Продавец претензий по оплате не имеет.

    ### 3. Передача Автомобиля
    ~ 3.1. Автомобиль, {{ keys_count }} {{ plural(keys_count, 'комплект', 'комплекта', 'комплектов') }} ключей, {% if pts_kind == 'epts' %}выписка из электронного паспорта транспортного средства{% else %}паспорт транспортного средства{% endif %}{% if sts_no %} и свидетельство о регистрации{% endif %} переданы Покупателю при подписании настоящего договора. Настоящий договор одновременно является актом приёма-передачи.
    ~ 3.2. Право собственности на Автомобиль переходит к Покупателю с момента его передачи (п. 1 ст. 223 Гражданского кодекса РФ).
    ~ 3.3. Покупатель осмотрел Автомобиль{% if defects %}. Продавец сообщил Покупателю о следующих недостатках: {{ defects }}{% endif %}. Претензий к техническому состоянию, комплектности и внешнему виду Автомобиля Покупатель не имеет.

    ### 4. Заключительные положения
    ~ 4.1. Покупатель обязуется в течение десяти дней со дня приобретения Автомобиля обратиться в регистрационное подразделение Госавтоинспекции с заявлением о внесении изменений в регистрационные данные (ст. 8 Федерального закона от 03.08.2018 № 283-ФЗ).
    ~ 4.2. Договор составлен в трёх экземплярах, имеющих одинаковую юридическую силу: по одному для Продавца, Покупателя и регистрационного подразделения Госавтоинспекции.

    ~ Продавец: {{ seller_fio }}
    ~ Денежные средства в сумме {{ money(price) }} руб. получены полностью, Автомобиль передан.
    = Подпись Продавца: | ____________ / {{ short(seller_fio) }}

    ~ Покупатель: {{ buyer_fio }}
    ~ Денежные средства переданы, Автомобиль, ключи и документы получены.
    = Подпись Покупателя: | ____________ / {{ short(buyer_fio) }}
  after: |
    <b>Как пользоваться</b>
    1. Распечатайте <b>3 экземпляра</b>, оба подписывают каждый экземпляр и каждую страницу. Продавцу обязательно оставить свой оригинал.
    2. Деньги лучше переводить на счёт продавца — это готовое доказательство оплаты. Наличные — пересчитайте при подписании.
    <b>Покупателю</b>: за 10 дней поставьте машину на учёт (Госуслуги или ГИБДД), иначе штраф. Возьмите договор, ПТС или выписку ЭПТС и паспорт; для машины старше 4 лет нужна действующая диагностическая карта. Полис ОСАГО продавца не переходит — оформите свой до выезда.
    <b>Продавцу</b>: если через 10 дней машина всё ещё на вас, прекратите регистрацию через Госуслуги или ГИБДД — нужен ваш оригинал договора. Налог: если машина была у вас меньше 3 лет, до 30 апреля следующего года подайте 3-НДФЛ; вычет 250 000 ₽ или подтверждённая цена покупки обычно обнуляют налог.
  followups: []
