- id: otkaz_strahovka
  category: dengi
  title: "Отказ от страховки и возврат денег (период охлаждения)"
  button: "Навязали страховку"
  price: 490
  verified: false
  filename: "Заявление_отказ_от_страховки.docx"
  sections:
    - {title: "Страховка", keys: [kind, policy, policy_date, premium]}
    - {title: "Кому", keys: [insurer, insurer_address, bank_name, bank_address, credit_contract]}
    - {title: "Возврат", keys: [refund_details]}
  short: "Навязали страховку в банке, при кредите или покупке. В период охлаждения можно отказаться и вернуть деньги."
  gives: "Заявление об отказе от добровольной страховки: в страховую (14 дней) или в банк, если вас подключили к его программе при кредите (30 дней)."
  basis: ["Указание Банка России от 20.11.2015 № 3854-У", "Федеральный закон от 21.12.2013 № 353-ФЗ «О потребительском кредите (займе)»: п. 3 ч. 2.1, ч. 2.5 ст. 7"]
  questions:
    - key: kind
      type: choice
      q: "Как оформлена страховка?"
      why: "От этого зависят срок и адресат: страховая или банк."
      options:
        - {v: own, label: "Полис на моё имя, договор со страховой"}
        - {v: collective, label: "Банк подключил к своей программе страхования при кредите"}
      example: own
    - key: policy
      type: text
      q: "Номер полиса, сертификата или заявления на подключение."
      example: "НЖ-123456789"
    - key: policy_date
      type: date
      past: true
      q: "Дата оформления страховки (подписания полиса или согласия на подключение). ДД.ММ.ГГГГ."
      example: "-6d"
    - key: premium
      type: money
      q: "Сколько заплатили за страховку, в рублях?"
      example: "48000"
    - key: insurer
      type: text
      when: "kind == 'own'"
      q: "Страховая компания (как в полисе)."
      example: "ООО СК «Надёжная Жизнь»"
    - key: insurer_address
      type: text
      when: "kind == 'own'"
      q: "Адрес страховой (есть в полисе или на сайте)."
      example: "123000, г. Москва, ул. Страховая, д. 1"
    - key: bank_name
      type: text
      when: "kind == 'collective'"
      q: "Банк, выдавший кредит (как в кредитном договоре)."
      example: "ПАО «Банк»"
    - key: bank_address
      type: text
      when: "kind == 'collective'"
      q: "Адрес банка (есть в кредитном договоре или на сайте)."
      example: "123000, г. Москва, ул. Банковская, д. 1"
    - key: credit_contract
      type: text
      when: "kind == 'collective'"
      q: "Номер и дата кредитного договора."
      example: "№ 625/0000-0000000 от 20.09.2026"
    - key: refund_details
      type: long
      q: "Реквизиты для возврата: банк, БИК, счёт, получатель."
      example: "АО «Т-Банк», БИК 044525974, счёт 40817810000000000000, получатель Иванов Иван Иванович"
    - use: person
  warnings:
    - when: "kind == 'own' and days_since(policy_date) > 14"
      block: true
      text: "Отказаться от собственного полиса в период охлаждения можно в течение 14 календарных дней с даты заключения. Этот срок прошёл. Если страховка связана с кредитом и кредит погашен досрочно, часть премии можно вернуть, но это другой документ."
    - when: "kind == 'collective' and days_since(policy_date) > 30"
      block: true
      text: "Отказаться от программы страхования банка можно в течение 30 календарных дней с даты согласия на подключение. Этот срок прошёл. При досрочном погашении кредита часть платы можно вернуть, но это другой документ."
    - when: "true"
      text: "Период охлаждения касается только добровольного страхования: ОСАГО и другие обязательные виды так не вернуть. И важно, чтобы страховых случаев не было."
  template: |
    {% if kind == 'own' %}
    > Кому: {{ insurer }}
    > {{ insurer_address }}
    {% else %}
    > Кому: {{ bank_name }}
    > {{ bank_address }}
    {% endif %}
    >
    > От: {{ fio }}
    > {{ address }}
    > Тел.: {{ phone }}{% if email %}, e-mail: {{ email }}{% endif %}

    {% if kind == 'own' %}
    # ЗАЯВЛЕНИЕ
    ## об отказе от договора добровольного страхования и возврате страховой премии

    {{ date(policy_date) }} между мной и {{ insurer }} заключён договор добровольного страхования (полис № {{ policy }}). Страховая премия в размере {{ money(premium) }} руб. уплачена.

    В соответствии с Указанием Банка России от 20.11.2015 № 3854-У «О минимальных (стандартных) требованиях к условиям и порядку осуществления отдельных видов добровольного страхования» отказываюсь от указанного договора страхования в течение четырнадцати календарных дней со дня его заключения.

    Прошу вернуть уплаченную страховую премию — в полном объёме, если на дату отказа договор ещё не вступил в силу, либо за вычетом её части, пропорциональной сроку действия договора, — в срок не более 10 рабочих дней со дня получения настоящего заявления по реквизитам:
    ~ {{ refund_details }}
    {% else %}
    # ЗАЯВЛЕНИЕ
    ## об исключении из числа застрахованных лиц и возврате платы за подключение к программе страхования

    {{ date(policy_date) }} в связи с заключением кредитного договора {{ credit_contract }} мной было выражено согласие на подключение к программе добровольного страхования (полис, сертификат или заявление № {{ policy }}). Плата за подключение к программе страхования, включая страховую премию, составила {{ money(premium) }} руб. и была уплачена.

    На основании п. 3 ч. 2.1 и ч. 2.5 ст. 7 Федерального закона от 21.12.2013 № 353-ФЗ «О потребительском кредите (займе)» прошу исключить меня из числа застрахованных лиц по указанной программе и в срок, не превышающий семи рабочих дней со дня получения настоящего заявления, вернуть денежные средства, уплаченные за подключение к программе страхования, в полном объёме по реквизитам:
    ~ {{ refund_details }}
    {% endif %}

    События, имеющие признаки страхового случая, не наступали.

    ~ Приложения:
    ~ 1. Копия {{ 'полиса (договора страхования)' if kind == 'own' else 'документа о подключении к программе страхования' }}.
    ~ 2. Копия документа об оплате.
    ~ 3. Копия паспорта.

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  after: |
    <b>Как отправить — срочно, срок идёт на дни</b>
    {% if kind == 'own' %}1. Отправьте заявление <b>в страховую</b>: лично в офис под отметку или заказным письмом с описью. Главное — уложиться в 14 дней с даты заключения полиса.
    2. Приложите копии паспорта и полиса.
    Не вернули за 10 рабочих дней — жалоба в интернет-приёмную Банка России (cbr.ru) и обращение к финансовому уполномоченному (finombudsman.ru), это бесплатно.{% else %}1. Отправьте заявление <b>в банк</b>, который подключил вас к программе: лично в отделение под отметку или заказным письмом с описью. Главное — уложиться в 30 дней с даты подключения.
    2. Приложите копии паспорта и документа о подключении.
    Банк должен вернуть деньги в полном объёме за 7 рабочих дней. Не вернул — жалоба в интернет-приёмную Банка России (cbr.ru) и обращение к финансовому уполномоченному (finombudsman.ru), это бесплатно.{% endif %}
  followups:
    - days: 16
      text: "Прошло 16 дней с отказа от страховки. Деньги вернули? Если нет — напишите жалобу в Банк России (cbr.ru → интернет-приёмная) и обращение к финансовому уполномоченному (finombudsman.ru), это бесплатно."

