- id: otkaz_uslugi
  category: pokupki
  title: "Отказ от курса, абонемента или подписки и возврат денег"
  button: "Вернуть деньги за курс, фитнес"
  price: 390
  verified: false
  filename: "Заявление_отказ_от_услуги.docx"
  sections:
    - {title: "Услуга", keys: [kind, service, contract_date, price, usage, total_units, done_units, valid_until]}
    - {title: "Исполнитель", keys: [executor_type, executor_name, executor_address, refund_details]}
  short: "Онлайн-курс, фитнес-клуб, подписка — передумали. Отказаться можно в любой момент, «невозвратных» денег не бывает."
  gives: "Заявление об отказе от договора по ст. 32 Закона о защите прав потребителей и ст. 782 ГК РФ с расчётом суммы к возврату."
  basis: ["Закон РФ «О защите прав потребителей»: ст. 16, 32", "Гражданский кодекс РФ: ст. 314, 395, 429.4, 782"]
  questions:
    - key: kind
      type: choice
      label: "Что за услуга"
      q: "От чего отказываемся?"
      options:
        - {v: course, label: "Онлайн-курс или обучение"}
        - {v: fitness, label: "Абонемент: фитнес, бассейн, спорт"}
        - {v: subscription, label: "Подписка или абонентское обслуживание"}
        - {v: other, label: "Другая услуга"}
      example: course
    - key: service
      type: text
      label: "Услуга"
      q: "Как называется курс, клуб или подписка, какой тариф?"
      example: "онлайн-курс «Интернет-маркетолог с нуля», тариф «Стандарт»"
    - key: contract_date
      type: date
      past: true
      label: "Дата оплаты"
      q: "Когда оплатили или заключили договор? ДД.ММ.ГГГГ."
      example: "-40d"
    - key: price
      type: money
      label: "Оплачено"
      q: "Сколько всего заплатили, в рублях?"
      example: "89000"
    - key: usage
      type: choice
      label: "Пользовались"
      q: "Уже пользовались услугой?"
      options:
        - {v: none, label: "Нет, ещё не начинали"}
        - {v: partly, label: "Да, частично"}
      example: partly
    - key: total_units
      type: int
      when: "usage == 'partly' and kind == 'course'"
      label: "Всего занятий (модулей)"
      q: "Сколько всего занятий или модулей в курсе?"
      example: "20"
    - key: done_units
      type: int
      when: "usage == 'partly' and kind == 'course'"
      label: "Пройдено"
      q: "Сколько из них вы уже прошли?"
      example: "4"
    - key: valid_until
      type: date
      when: "usage == 'partly' and (kind == 'fitness' or kind == 'subscription')"
      label: "Действует до"
      q: "До какой даты действует абонемент или оплаченная подписка? ДД.ММ.ГГГГ."
      example: "+240d"
    - key: executor_type
      type: choice
      label: "Кто исполнитель"
      q: "Кто продал услугу? Посмотрите договор, оферту или чек."
      why: "Закон о защите прав потребителей работает, когда исполнитель — компания, ИП или человек, который оказывает услуги постоянно (например, самозанятый)."
      options:
        - {v: company, label: "Компания или ИП"}
        - {v: selfemployed, label: "Самозанятый, работает постоянно"}
        - {v: person, label: "Частное лицо, разовая услуга"}
      example: company
    - key: executor_name
      type: text
      label: "Исполнитель"
      q: "Название исполнителя (как в договоре, оферте или чеке)."
      example: "ООО «Онлайн Школа»"
    - key: executor_address
      type: text
      label: "Адрес исполнителя"
      q: "Адрес исполнителя. У онлайн-школ юридический адрес есть в оферте или внизу сайта."
      example: "123000, г. Москва, ул. Учебная, д. 3"
    - key: refund_details
      type: long
      label: "Реквизиты"
      q: "Куда вернуть деньги: банк, БИК, номер счёта, получатель."
      example: "АО «Т-Банк», БИК 044525974, счёт 40817810000000000000, получатель Иванов Иван Иванович"
    - use: person
  computed:
    zpp: "executor_type != 'person'"
    days_total: "((valid_until - contract_date).days) if valid_until else 0"
    days_left: "([(valid_until - today).days, 0] | max) if valid_until else 0"
    refund_calc: "(price if usage == 'none' else ((price * days_left / days_total) if days_total > 0 else ((price * (total_units - done_units) / total_units) if (total_units and done_units is not none and done_units <= total_units) else 0))) | round(2)"
  vars:
    law: "Закона РФ от 07.02.1992 № 2300-1 «О защите прав потребителей» (далее — Закон)"
  warnings:
    - when: "usage == 'partly' and kind == 'course' and done_units > total_units"
      block: true
      text: "Пройдено больше занятий, чем есть в курсе. Проверьте цифры."
    - when: "usage == 'partly' and (kind == 'fitness' or kind == 'subscription') and days_since(valid_until) >= 0"
      block: true
      text: "Срок абонемента или подписки уже закончился — возвращать за неиспользованный период нечего. Если с вас продолжают списывать деньги, просто отключите автоплатёж в банке и напишите исполнителю, что отказываетесь от продления."
    - when: "executor_type == 'person'"
      text: "Если исполнитель — частное лицо и услуга разовая, Закон о защите прав потребителей не применяется. Отказаться всё равно можно (ст. 782 ГК РФ), но без штрафа и компенсации морального вреда."
    - when: "true"
      text: "Исполнитель может удержать только то, что реально потратил или уже оказал, и это он должен доказать документами. Условия «деньги не возвращаются» и штрафы за отказ недействительны."
  template: |
    > Кому: {{ executor_name }}
    > {{ executor_address }}
    >
    > От: {{ fio }}
    > {{ address }}
    > Тел.: {{ phone }}{% if email %}, e-mail: {{ email }}{% endif %}

    # ЗАЯВЛЕНИЕ
    ## об отказе от исполнения договора об оказании услуг и возврате денежных средств

    {{ date(contract_date) }} между мной и {{ executor_name }} заключён договор об оказании услуг: {{ service }} (далее — Договор). По Договору мной оплачено {{ money(price) }} руб.

    {% if zpp %}
    В соответствии со ст. 32 {{ law }} и п. 1 ст. 782 Гражданского кодекса РФ потребитель вправе отказаться от исполнения договора об оказании услуг в любое время при условии оплаты исполнителю фактически понесённых им расходов, связанных с исполнением обязательств по договору. Условия договора, устанавливающие штрафные санкции или иные обязанности, препятствующие реализации этого права, в том числе о невозврате оплаты, являются недопустимыми и ничтожными (п. 1, пп. 3 п. 2 ст. 16 Закона).
    {% else %}
    В соответствии с п. 1 ст. 782 Гражданского кодекса РФ заказчик вправе отказаться от исполнения договора возмездного оказания услуг при условии оплаты исполнителю фактически понесённых им расходов.
    {% endif %}

    Настоящим заявлением отказываюсь от исполнения Договора.

    {% if usage == 'none' %}
    Услуги по Договору мне не оказывались, поэтому уплаченная сумма подлежит возврату в полном объёме.
    {% elif kind == 'course' %}
    Из {{ total_units }} занятий (модулей) курса мной пройдено {{ done_units }}. Стоимость непройденной части, рассчитанная пропорционально, составляет {{ money(refund_calc) }} руб.
    {% elif kind == 'fitness' or kind == 'subscription' %}
    Договор действует до {{ date(valid_until) }}. На дату настоящего заявления не использовано {{ days_left }} {{ plural(days_left, 'день', 'дня', 'дней') }} из {{ days_total }}. Стоимость неиспользованного периода, рассчитанная пропорционально, составляет {{ money(refund_calc) }} руб. Если Договор является абонентским, плата за период после его прекращения также подлежит возврату (ст. 429.4 Гражданского кодекса РФ; п. 10 Обзора судебной практики по делам о защите прав потребителей, утв. Президиумом Верховного Суда РФ 18.10.2023).
    {% else %}
    Услуги по Договору оказаны мне частично.
    {% endif %}

    На основании изложенного прошу:
    {% if usage == 'none' %}
    ~ 1. Вернуть уплаченную по Договору сумму {{ money(price) }} руб.
    {% elif refund_calc > 0 %}
    ~ 1. Вернуть денежные средства в размере не менее {{ money(refund_calc) }} руб.
    {% else %}
    ~ 1. Вернуть уплаченную по Договору сумму {{ money(price) }} руб. за вычетом стоимости фактически оказанных услуг и документально подтверждённых расходов.
    {% endif %}
    ~ 2. Если вы считаете, что понесли фактические расходы, связанные с исполнением Договора, — представить документы, их подтверждающие. Удержание сумм без такого подтверждения не допускается.
    {% if kind == 'subscription' %}
    ~ 3. Прекратить автоматические списания денежных средств по Договору.
    {% endif %}

    Денежные средства прошу перечислить в течение семи дней со дня получения настоящего заявления (п. 2 ст. 314 Гражданского кодекса РФ) по реквизитам:
    ~ {{ refund_details }}

    В случае неправомерного удержания денежных средств я обращусь в суд с требованием о взыскании уплаченной суммы и процентов за пользование чужими денежными средствами (ст. 395 Гражданского кодекса РФ){% if zpp %}, компенсации морального вреда (ст. 15 Закона) и штрафа (п. 6 ст. 13 Закона), а также с жалобой в Роспотребнадзор{% endif %}.

    Ответ прошу направить по адресу, указанному выше{% if email %}, или на e-mail {{ email }}{% endif %}.

    ~ Приложения:
    ~ 1. Копия договора (оферты), чека или другого документа об оплате.

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  after: |
    <b>Как отправить</b>
    1. Отправьте заявление на e-mail исполнителя из договора или оферты (скан с подписью) и сохраните письмо.
    2. Надёжнее — параллельно заказным письмом с описью вложения на юридический адрес. От даты получения считаются 7 дней на возврат.
    3. Сохраните договор, чек, переписку и скриншоты личного кабинета{% if kind == 'course' %} (сколько занятий пройдено){% endif %}.
    {% if kind == 'course' %}Если курс оплачен в кредит или рассрочку, кредит сам не закроется: платите по графику, а деньги от школы направьте на досрочное погашение.
    {% endif %}{% if kind == 'subscription' %}Сразу отключите автоплатёж в банке или в настройках подписки — не дожидаясь ответа.
    {% endif %}Не вернули за 7 дней — жалоба в Роспотребнадзор (бесплатно) и иск в суд по месту вашего жительства; потребители не платят госпошлину по искам до 1 млн ₽.
  followups:
    - days: 10
      text: "Прошло 10 дней с отказа от «{{ service }}». Деньги вернули? Если нет — следующий шаг: жалоба в Роспотребнадзор."
      offer: zhaloba_rpn

