    - {title: "Что передаётся", keys: [keys, meters, items, state]}
  track: false
  short: "Главная защита залога: фиксируем состояние квартиры, показания счётчиков и имущество при въезде и выезде."
  gives: "Акт со списком имущества, показаниями счётчиков и описанием состояния — на подпись обеим сторонам."
  basis: ["Гражданский кодекс РФ: ст. 611, 655 (по аналогии для найма)"]
  kind: act
  questions:
    - key: direction
      type: choice
      q: "Это заезд или выезд?"
      options:
        - {v: in, label: "Заезжаю"}
        - {v: out, label: "Съезжаю"}
      example: in
    - key: landlord
      type: fio
      q: "ФИО собственника (наймодателя)."
      example: "Петров Пётр Петрович"
    - key: flat
      type: text
      q: "Адрес квартиры."
      example: "г. Москва, ул. Зелёная, д. 5, кв. 12"
    - key: act_date
      type: date
      q: "Дата передачи. ДД.ММ.ГГГГ."
      example: "0d"
    - key: keys
      type: int
      q: "Сколько комплектов ключей передаётся?"
      example: "2"
    - key: meters
      type: long
      q: "Показания счётчиков через «;». Например: электричество 12345; холодная вода 234; горячая вода 123."
      example: "электричество 12345; холодная вода 234; горячая вода 123"
    - key: items
      type: long
      q: "Мебель и техника через «;». Например: диван угловой; холодильник Bosch; стиральная машина LG."
      example: "диван угловой; холодильник Bosch; стиральная машина LG; шкаф-купе; кровать двуспальная"
    - key: state
      type: long
      q: "Состояние квартиры и замеченные дефекты. Если всё в порядке — так и напишите."
      example: "царапина на дверце шкафа-купе; небольшое пятно на ковре в комнате; остальное в хорошем состоянии"
    - key: fio
      type: fio
      q: "Ваши ФИО (нанимателя)."
      example: "Иванов Иван Иванович"
  template: |
    # АКТ
    ## приёма-передачи жилого помещения

    = г. ______________ | {{ date(act_date) }}

    Наймодатель {{ landlord }}, с одной стороны, и наниматель {{ fio }}, с другой стороны, составили настоящий акт о том, что {{ 'наймодатель передал, а наниматель принял' if direction == 'in' else 'наниматель передал, а наймодатель принял' }} жилое помещение по адресу: {{ flat }}.

    ~ 1. Передано комплектов ключей: {{ keys }}.

    ~ 2. Показания приборов учёта на дату передачи:
    {% for m in lines(meters) %}
    ~ — {{ m }}
    {% endfor %}

    ~ 3. В помещении находится следующее имущество:
    {% for it in lines(items) %}
    ~ {{ loop.index }}) {{ it }}
    {% endfor %}

    ~ 4. Состояние помещения и имущества: {{ state }}.

    Стороны осмотрели помещение и имущество. Иных недостатков, кроме указанных в п. 4, не выявлено. Претензий друг к другу по состоянию помещения на дату подписания акта стороны не имеют. Акт составлен в двух экземплярах, по одному для каждой стороны.

    ~ Наймодатель: ____________ / {{ short(landlord) }}

    ~ Наниматель: ____________ / {{ short(fio) }}
  after: |
    <b>Как пользоваться</b>
    1. Распечатайте 2 экземпляра, пройдитесь по квартире вместе и допишите от руки, если что-то нашли.
    2. <b>Сфотографируйте и снимите видео</b> всех дефектов и счётчиков в день подписания — с датой.
    3. Оба подписывают оба экземпляра. Свой храните до возврата залога.

