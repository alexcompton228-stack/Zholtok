    # ЗАЯВЛЕНИЕ
    ## об отказе от товара, приобретённого дистанционным способом

    Дистанционным способом{% if order_no %} (заказ № {{ order_no }}){% endif %} мной был приобретён товар: {{ item }} (далее — Товар) стоимостью {{ money(price) }} руб. Товар получен {{ date(received_date) }}.

    В соответствии с п. 4 ст. 26.1 Закона РФ от 07.02.1992 № 2300-1 «О защите прав потребителей» потребитель вправе отказаться от товара в любое время до его передачи, а после передачи — в течение {{ 'семи дней' if info_given else 'трёх месяцев, поскольку информация о порядке и сроках возврата товара надлежащего качества в письменной форме в момент доставки предоставлена не была' }}.

    Товар не был в употреблении, сохранены его товарный вид и потребительские свойства, а также документ, подтверждающий факт и условия покупки.

    На основании изложенного отказываюсь от Товара и прошу вернуть уплаченную за него сумму {{ money(price) }} руб. не позднее чем через 10 дней со дня предъявления настоящего требования (п. 4 ст. 26.1 Закона) на банковскую карту, с которой производилась оплата. Прошу сообщить адрес и способ возврата Товара.

    ~ Приложения:
    ~ 1. Копия документа об оплате (электронный чек, подтверждение заказа).

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  after: |
    <b>Как отправить</b>
    1. Отправьте заявление в чат с продавцом или в поддержку маркетплейса (скан или фото с подписью).
    2. Параллельно — заказным письмом с описью на адрес продавца. Это доказательство для суда.
    3. Товар отдавайте так, как скажет продавец, и сохраняйте чек отправки.
    Продавец может удержать расходы на доставку возвращённого товара от вас — это законно.

