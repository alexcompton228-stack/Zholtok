- id: zhaloba_rpn
  category: pokupki
  title: "Жалоба в Роспотребнадзор"
  button: "Жалоба в Роспотребнадзор"
  price: 290
  verified: false
  filename: "Жалоба_в_Роспотребнадзор.docx"
  sections:
    - {title: "Адресат", keys: [region]}
    - {title: "Нарушитель", keys: [company, company_inn, company_address]}
    - {title: "Что произошло", keys: [story, claim_date, response]}
  short: "Продавец или исполнитель проигнорировал претензию. Подключаем надзор."
  gives: "Обращение в территориальное управление Роспотребнадзора + как подать онлайн."
  basis: ["Закон РФ «О защите прав потребителей»: ст. 40", "Федеральный закон от 02.05.2006 № 59-ФЗ «О порядке рассмотрения обращений граждан»"]
  questions:
    - key: region
      type: text
      q: "Регион, где находится продавец. Например: г. Москве, Московской области, Республике Татарстан (напишите, как после слов «по …»)."
      example: "г. Москве"
    - key: company
      type: text
      q: "Название компании-нарушителя."
      example: "ООО «Техномаркет»"
    - key: company_inn
      type: text
      optional: true
      q: "ИНН компании. Если не знаете, отправьте «-»."
      example: "7700000000"
    - key: company_address
      type: text
      q: "Адрес компании или магазина."
      example: "123000, г. Москва, ул. Тверская, д. 5"
    - key: story
      type: long
      q: "Коротко: что вы купили или заказали, когда, что пошло не так."
      example: "12.08.2026 купил смартфон за 24 990 руб. Через неделю он перестал заряжаться."
    - key: claim_date
      type: date
      past: true
      q: "Когда отправили продавцу претензию? ДД.ММ.ГГГГ."
      example: "-15d"
    - key: response
      type: choice
      q: "Что ответили?"
      options:
        - {v: none, label: "Ничего"}
        - {v: refusal, label: "Отказали"}
        - {v: partial, label: "Выполнили частично"}
      example: none
    - use: person
  template: |
    > В Управление Роспотребнадзора по {{ region }}
    >
    > От: {{ fio }}
    > {{ address }}
    > Тел.: {{ phone }}{% if email %}, e-mail: {{ email }}{% endif %}

    # ЖАЛОБА
    ## на нарушение прав потребителя

    Сведения о нарушителе: {{ company }}{% if company_inn %}, ИНН {{ company_inn }}{% endif %}, адрес: {{ company_address }}.

    Обстоятельства: {{ story }}.

    {{ date(claim_date) }} в адрес {{ company }} мной была направлена претензия с требованиями, основанными на Законе РФ от 07.02.1992 № 2300-1 «О защите прав потребителей». {% if response == 'none' %}Установленный Законом срок истёк, ответ не получен, требования не удовлетворены.{% elif response == 'refusal' %}В удовлетворении требований мне было отказано.{% else %}Требования удовлетворены лишь частично.{% endif %}

    Считаю, что действиями {{ company }} нарушены мои права как потребителя.

    Прошу:
    ~ 1. Рассмотреть настоящую жалобу и принять меры, предусмотренные законодательством, в отношении {{ company }}.
    ~ 2. Сообщить мне о результатах рассмотрения жалобы по указанному адресу{% if email %} или на e-mail {{ email }}{% endif %}.

    ~ Приложения:
    ~ 1. Копия претензии от {{ date(claim_date) }} и доказательство её отправки.
    ~ 2. Копия документа о покупке (оплате).
    ~ 3. Ответ продавца (при наличии).

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  after: |
    <b>Как подать</b>
    Проще всего онлайн: Госуслуги или электронная приёмная на сайте rospotrebnadzor.ru. Вставьте текст, приложите скан претензии и чек.
    Важно: Роспотребнадзор не вернёт деньги сам, но его реакция — хорошее давление и доказательство для суда. Если деньги не вернули — следующий шаг суд: потребители не платят госпошлину по искам до 1 млн ₽.

