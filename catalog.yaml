- id: vychet_plan
  category: nalogi
  title: "План возврата налога: сколько вернут и какие документы нужны"
  button: "Сколько налога вернут"
  price: 390
  verified: false
  filename: "План_налогового_вычета.docx"
  sections:
    - {title: "Год и доход", keys: [year, income]}
    - {title: "Расходы", keys: [types, amt_med, amt_drugs, amt_exp, amt_edu, amt_child, children, amt_fit]}
  track: false
  short: "Лечение, лекарства, учёба, фитнес. Считаем, сколько вернёт государство, и даём пошаговый план с 3-НДФЛ."
  gives: "Расчёт суммы возврата, список документов под ваш случай и пошаговая инструкция подачи 3-НДФЛ в личном кабинете."
  basis: ["Налоговый кодекс РФ: ст. 219 (социальные вычеты), ст. 78 (возврат налога)"]
  kind: memo
  computed:
    lim_social: "150000 if year >= 2024 else 120000"
    lim_child: "110000 if year >= 2024 else 50000"
    social_sum: "(amt_med or 0) + (amt_drugs or 0) + (amt_edu or 0) + (amt_fit or 0)"
    social_ok: "[social_sum, lim_social] | min"
    child_ok: "[(amt_child or 0), lim_child * (children or 1)] | min"
    base: "social_ok + child_ok + (amt_exp or 0)"
    tax_paid: "income * 0.13"
    refund: "[base * 0.13, tax_paid] | min"
    refund_capped: "base * 0.13 > tax_paid"
    doc_checklist: "deduction_docs(types, year)"
  questions:
    - key: year
      type: int
      q: "За какой год оплачивали расходы? Вернуть можно за 3 последних года. Если за несколько лет — пройдите отдельно по каждому."
      example: "2025"
    - key: income
      type: money
      q: "Ваш официальный доход за этот год до вычета налога (примерно, в рублях). Налог должен был удерживаться 13%."
      example: "900000"
    - key: types
      type: multi
      q: "За что платили? Отметьте всё и нажмите «Готово»."
      options:
        - {v: med, label: "Лечение, стоматология"}
        - {v: drugs, label: "Лекарства по назначению"}
        - {v: exp, label: "Дорогостоящее лечение"}
        - {v: edu, label: "Своё обучение, курсы"}
        - {v: child, label: "Обучение детей"}
        - {v: fit, label: "Фитнес, спорт"}
      example: [med, child]
    - key: amt_med
      type: money
      when: "'med' in types"
      q: "Сколько заплатили за лечение за год?"
      example: "60000"
    - key: amt_drugs
      type: money
      when: "'drugs' in types"
      q: "Сколько за лекарства?"
      example: "15000"
    - key: amt_exp
      type: money
      when: "'exp' in types"
      q: "Сколько за дорогостоящее лечение? (в справке клиники стоит код услуги «2»)"
      example: "300000"
    - key: amt_edu
      type: money
      when: "'edu' in types"
      q: "Сколько за своё обучение?"
      example: "80000"
    - key: amt_child
      type: money
      when: "'child' in types"
      q: "Сколько за обучение детей всего?"
      example: "70000"
    - key: children
      type: int
      when: "'child' in types"
      q: "За скольких детей платили?"
      example: "1"
    - key: amt_fit
      type: money
      when: "'fit' in types"
      q: "Сколько за фитнес или спорт?"
      example: "30000"
    - key: fio
      type: fio
      q: "Ваши ФИО (для заголовка плана)."
      example: "Иванов Иван Иванович"
  warnings:
    - when: "year < today.year - 3"
      block: true
      text: "Вычет можно получить только за 3 последних года. За этот год уже не вернуть."
    - when: "year >= today.year"
      block: true
      text: "За текущий год 3-НДФЛ подаётся со следующего года. Возвращайтесь в январе — или выберите прошлый год."
    - when: "income > 2400000"
      text: "При доходе больше 2,4 млн ₽ в год с 2025 года действует прогрессивная шкала. Возврат по части вычета может считаться по другой ставке — в плане показан ориентир по 13%."
  template: |
    # ПЕРСОНАЛЬНЫЙ ПЛАН НАЛОГОВОГО ВЫЧЕТА
    ## {{ fio }} · расходы за {{ year }} год

    Это расчёт-ориентир и инструкция, а не налоговая консультация. Точную сумму определит налоговая после проверки декларации.

    ### 1. Сколько можно вернуть

    {% if social_sum > 0 %}
    ~ Лечение, лекарства, своё обучение, фитнес: расходы {{ money(social_sum) }} руб., к вычету — {{ money(social_ok) }} руб. (общий лимит {{ money(lim_social) }} руб. в год на эти расходы вместе).
    {% endif %}
    {% if 'child' in types %}
    ~ Обучение детей: расходы {{ money(amt_child) }} руб., к вычету — {{ money(child_ok) }} руб. (лимит {{ money(lim_child) }} руб. на каждого ребёнка).
    {% endif %}
    {% if 'exp' in types %}
    ~ Дорогостоящее лечение: {{ money(amt_exp) }} руб., без лимита.
    {% endif %}

    Итого база вычета: {{ money(base) }} руб. Возврат — 13% от неё, но не больше налога, удержанного за год.

    ### Ориентировочно к возврату: {{ money(refund) }} руб.{% if refund_capped %} (ограничено налогом, удержанным с твоего дохода: {{ money(tax_paid) }} руб.){% endif %}

    ### 2. Какие документы собрать
    {% for line in doc_checklist %}
    ~ — {{ line }}
    {% endfor %}

    ### 3. Как подать 3-НДФЛ (онлайн, бесплатно)
    ~ 1) Зайди в личный кабинет налогоплательщика на nalog.ru (можно через Госуслуги).
    ~ 2) Проверь раздел с предложениями о вычете: за расходы с 2024 года часть клиник, вузов и фитнес-клубов передаёт данные в налоговую сами, и вычет могут предложить в упрощённом порядке — тогда достаточно подтвердить.
    ~ 3) Если предложения нет: «Жизненные ситуации» → «Подать декларацию 3-НДФЛ» → год {{ year }} → заполнить онлайн. Доходы и налог от работодателя подтянутся сами.
    ~ 4) В разделе вычетов выбери социальные вычеты и внеси суммы из справок.
    ~ 5) Прикрепи сканы документов из пункта 2 и подпиши декларацию электронной подписью (её можно бесплатно выпустить прямо в кабинете).
    ~ 6) После проверки декларации (обычно до 3 месяцев) подай заявление о возврате переплаты на свою карту — в кабинете, в разделе «Сальдо ЕНС».

    ### 4. Сроки
    ~ Декларацию на вычет можно подать в любой момент в течение 3 лет после года расходов. Для расходов {{ year }} года — до конца {{ year + 3 }} года.
  after: |
    <b>Что дальше</b>
    Справки об оплате для налоговой выдают клиника, вуз или спортклуб. Нужно заявление на справку — оно есть в разделе «Налоговый вычет» → «Справка для вычета».

