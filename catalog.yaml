      options:
        - {v: hand, label: "Лично на руки"}
        - {v: mail, label: "Почтой на мой адрес"}
        - {v: email, label: "На e-mail"}
      example: hand
    - use: person
  template: |
    > {{ 'Бывшему работодателю' if fired else 'Работодателю' }}: {{ employer }}
    > {{ employer_address }}
    >
    > От: {{ fio }}
    > {{ 'бывший работник, ' if fired else '' }}{{ position }}
    > {{ address }}
    > Тел.: {{ phone }}{% if email %}, e-mail: {{ email }}{% endif %}

    # ЗАЯВЛЕНИЕ
    ## о выдаче документов, связанных с работой

    На основании ст. 62 Трудового кодекса РФ{% if 'dohod' in docs %} и п. 3 ст. 230 Налогового кодекса РФ{% endif %} прошу выдать мне следующие документы:
    {% for line in doc_lines %}
    ~ {{ loop.index }}. {{ line }}
    {% endfor %}

    Документы прошу {{ delivery_text }} не позднее трёх рабочих дней со дня получения настоящего заявления. Копии документов должны быть заверены надлежащим образом и предоставляются безвозмездно (ст. 62 ТК РФ).

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  vars:
    delivery_text: "{% if delivery == 'hand' %}выдать мне на руки{% elif delivery == 'mail' %}направить почтой по адресу: {{ address }}{% else %}направить на адрес электронной почты {{ email or '[укажите e-mail]' }}{% endif %}"
  computed:
    doc_lines: "doc_list(docs, period)"
  after: |
    <b>Что делать</b>
    1. Распечатайте 2 экземпляра. Один отдайте в отдел кадров или бухгалтерию, на втором попросите отметку: дата, подпись.
    2. {% if fired %}Если к бывшему работодателю не попасть — отправьте заказным письмом с описью.{% else %}Можно подать через канцелярию или секретаря — главное, чтобы на вашем экземпляре была отметка о приёме.{% endif +%}
    3. Срок — 3 рабочих дня. Не выдали — это нарушение, можно жаловаться в трудовую инспекцию.
    {% if 'dohod' in docs %}Лайфхак: справку о доходах за прошлые годы часто можно бесплатно скачать в личном кабинете налогоплательщика на nalog.ru (раздел «Доходы»), если работодатель уже сдал отчётность. Заявление нужно, если там пусто или справка нужна с печатью.{% endif %}

