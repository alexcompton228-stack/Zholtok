    - {title: "Документы", keys: [docs, period, delivery]}
  short: "Бывшая 2-НДФЛ, копия трудовой, справка для пособий. Работодатель обязан выдать за 3 рабочих дня."
  gives: "Заявление по ст. 62 ТК РФ и п. 3 ст. 230 НК РФ с нужным списком документов."
  basis: ["Трудовой кодекс РФ: ст. 62", "Налоговый кодекс РФ: п. 3 ст. 230"]
