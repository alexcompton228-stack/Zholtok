    - key: contract_date
      type: date
      past: true
      q: "Дата договора или заказа. ДД.ММ.ГГГГ."
      example: "-20d"
    - key: contract_no
      type: text
      optional: true
      q: "Номер договора, квитанции или наряда. Если нет, отправьте «-»."
      example: "0457"
    - key: price
      type: money
      q: "Сколько заплатили, в рублях?"
      example: "8500"
    - key: defect
      type: long
      q: "Что не так с результатом? 1–2 предложения."
      example: "через три дня после ремонта машина снова гудит и протекает при отжиме"
    - key: demand
      type: choice
