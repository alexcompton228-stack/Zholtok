- id: spravka_vychet
  category: nalogi
  title: "Заявление на справку для налогового вычета (клиника, учёба, спорт)"
  button: "Справка для вычета"
  price: 190
  verified: false
  filename: "Заявление_справка_для_вычета.docx"
  sections:
    - {title: "Организация", keys: [org_type, org_name, years, contract]}
    - {title: "За кого платили", keys: [whom, patient]}
    - {title: "Справка", keys: [inn, delivery]}
  short: "Клиника, вуз, школа, кружок или фитнес-клуб должны выдать справку об оплате для налоговой."
  gives: "Заявление в организацию на справку об оплате по форме для налоговой (+ копию лицензии для учёбы)."
  basis: ["Налоговый кодекс РФ: ст. 219", "Формы справок утверждены приказами ФНС России (сверить действующие)"]
  questions:
    - key: org_type
      type: choice
      q: "Куда пишем?"
      options:
        - {v: med, label: "Клиника, стоматология"}
        - {v: edu, label: "Вуз, школа, курсы, кружок"}
        - {v: fit, label: "Фитнес-клуб, спортшкола"}
      example: med
    - key: org_name
      type: text
      q: "Название организации, как в договоре."
      example: "ООО «Стоматология Улыбка»"
    - key: years
      type: text
      q: "За какой год или годы нужна справка? Например: 2025 или 2023–2025."
      example: "2025"
    - key: whom
      type: choice
      q: "За кого платили?"
      options:
        - {v: self, label: "За себя"}
        - {v: child, label: "За ребёнка"}
        - {v: spouse, label: "За супруга(у)"}
        - {v: parent, label: "За родителя"}
      example: self
    - key: patient
      type: fio
      when: "whom != 'self'"
      q: "ФИО того, за кого платили (пациента или ученика)."
      example: "Иванова Мария Ивановна"
    - key: contract
      type: text
      optional: true
      q: "Номер и дата договора, если знаете. Если нет, отправьте «-»."
      example: "№ 15 от 10.02.2025"
    - key: inn
      type: text
      q: "Ваш ИНН (12 цифр) — он нужен в справке. Узнать: nalog.ru → «Узнать ИНН»."
      example: "770000000000"
    - key: delivery
      type: choice
      q: "Как получить справку?"
      options:
        - {v: hand, label: "Заберу сам"}
        - {v: email, label: "На e-mail"}
        - {v: fns, label: "Передать сразу в налоговую"}
      example: hand
    - use: person
  template: |
    > Руководителю {{ org_name }}
    >
    > От: {{ fio }}
    > ИНН {{ inn }}
    > {{ address }}
    > Тел.: {{ phone }}{% if email %}, e-mail: {{ email }}{% endif %}

    # ЗАЯВЛЕНИЕ
    ## о выдаче справки для получения социального налогового вычета

    Прошу выдать мне справку {{ spr_name }} за {{ years }} год(ы) для представления в налоговый орган в целях получения социального налогового вычета по ст. 219 Налогового кодекса РФ, по форме, утверждённой ФНС России.

    Оплату {{ 'услуг' if org_type != 'edu' else 'обучения' }} производил(а) я, {{ fio }}, ИНН {{ inn }}{% if whom != 'self' %}, в пользу {{ whom_text }} — {{ patient }}{% else %}, в свою пользу{% endif %}{% if contract %}, договор {{ contract }}{% endif %}.
    {% if org_type == 'edu' %}

    Также прошу выдать заверенную копию лицензии на осуществление образовательной деятельности (если её реквизиты не указаны в договоре).
    {% endif %}

    Справку прошу {% if delivery == 'hand' %}выдать мне на руки{% elif delivery == 'email' %}направить на адрес электронной почты {{ email or '[укажите e-mail]' }}{% else %}направить непосредственно в налоговый орган (если такая возможность предусмотрена){% endif %}.

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  vars:
