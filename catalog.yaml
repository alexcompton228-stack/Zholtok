- id: otkaz_dopuslugi
  category: dengi
  title: "Отказ от навязанной дополнительной услуги и возврат денег"
  button: "Навязали доп. услуги"
  price: 490
  verified: false
  filename: "Заявление_отказ_от_допуслуги.docx"
  sections:
    - {title: "Услуга", keys: [place, service, form_type, contract_date, price, used]}
    - {title: "Кредит", keys: [with_credit, bank_name, credit_contract, in_app]}
    - {title: "Исполнитель", keys: [executor_name, executor_inn, executor_address, refund_details]}
  short: "«Помощь на дорогах», сертификаты, гарантии, карты при покупке машины или кредите. Отказаться можно, деньги возвращают."
  gives: "Заявление об отказе от допуслуги: в первые 30 дней после кредита — по закону о потребкредите (возврат за 7 рабочих дней), позже — по ст. 32 Закона о защите прав потребителей."
  basis: ["Федеральный закон от 21.12.2013 № 353-ФЗ «О потребительском кредите (займе)»: ч. 2.7–2.12 ст. 7", "Закон РФ «О защите прав потребителей»: ст. 13, 15, 16, 32", "Гражданский кодекс РФ: ст. 314, 395, 782"]
  questions:
    - key: place
      type: choice
      label: "Где оформили"
      q: "Где вам оформили услугу?"
      options:
        - {v: car, label: "В автосалоне при покупке машины"}
        - {v: bank, label: "В банке при кредите"}
        - {v: other, label: "В другом месте"}
      example: car
    - key: service
      type: text
      label: "Услуга"
      q: "Что за услуга и как называется документ?"
      example: "сертификат «Помощь на дорогах» № 1234567, тариф «Премиум»"
    - key: form_type
      type: choice
      label: "Как оформлено"
      q: "Как это оформлено? Посмотрите заголовок договора или сертификата."
      why: "Продавцы специально оформляют услугу как гарантию или опцион, чтобы не возвращать деньги. Суды это не принимают — упомянем нужную позицию Верховного Суда."
      options:
        - {v: abonent, label: "Абонентский договор, карта на срок"}
        - {v: guarantee, label: "Независимая гарантия"}
        - {v: option, label: "Опционный договор"}
        - {v: usual, label: "Обычный договор или сертификат на услуги"}
        - {v: unknown, label: "Не знаю"}
      example: abonent
    - key: contract_date
      type: date
      past: true
      label: "Дата оформления"
      q: "Когда оформили услугу (дата подписи)? ДД.ММ.ГГГГ."
      example: "-12d"
    - key: price
      type: money
      label: "Стоимость"
      q: "Сколько стоила услуга, в рублях?"
      example: "150000"
    - key: used
      type: yesno
      label: "Пользовались"
      q: "Вы пользовались услугой? Например, вызывали эвакуатор или получали консультацию."
      example: false
    - key: with_credit
      type: yesno
      label: "Связана с кредитом"
      q: "Услугу оплатили из кредита или оформили вместе с кредитом?"
      example: true
    - key: bank_name
      type: text
      when: "with_credit"
      label: "Банк"
      q: "Какой банк выдал кредит (как в договоре)?"
      example: "ПАО «Банк»"
    - key: credit_contract
      type: text
      when: "with_credit"
      label: "Кредитный договор"
      q: "Номер и дата кредитного договора."
      example: "№ 625/0000-0000000 от 18.09.2026"
    - key: in_app
      type: choice
      when: "with_credit"
      label: "Указана в заявлении на кредит"
      q: "Эта услуга указана в заявлении-анкете на кредит? Там есть раздел о дополнительных услугах с отметками."
      why: "Если указана, работает закон о потребкредите: 30 дней на отказ и возврат за 7 рабочих дней, а если исполнитель не вернёт — деньги обязан вернуть банк."
      options:
        - {v: "yes", label: "Да, указана"}
        - {v: "no", label: "Нет"}
        - {v: unknown, label: "Не знаю"}
      example: "yes"
    - key: executor_name
      type: text
      label: "Исполнитель"
      q: "Кто исполнитель услуги? Это компания, указанная в сертификате или договоре, а не автосалон."
      example: "ООО «Помощь в пути»"
    - key: executor_inn
      type: text
      optional: true
      label: "ИНН исполнителя"
      q: "ИНН исполнителя (есть в сертификате или договоре). Если нет, отправьте «-»."
      example: "7700000000"
    - key: executor_address
      type: text
      label: "Адрес исполнителя"
      q: "Адрес исполнителя (из договора или сертификата)."
      example: "123000, г. Москва, ул. Сервисная, д. 9"
    - key: refund_details
      type: long
      label: "Реквизиты"
      q: "Куда вернуть деньги: банк, БИК, номер счёта, получатель. Можно указать счёт кредита — так деньги сразу пойдут в погашение."
      example: "АО «Т-Банк», БИК 044525974, счёт 40817810000000000000, получатель Иванов Иван Иванович"
    - use: person
  computed:
    credit_law: "with_credit and in_app == 'yes' and days_since(contract_date) <= 30"
  vars:
    law: "Закона РФ от 07.02.1992 № 2300-1 «О защите прав потребителей» (далее — Закон)"
  warnings:
    - when: "with_credit and in_app == 'yes' and days_since(contract_date) > 30"
      text: "С оформления прошло больше 30 дней, поэтому ссылаемся не на закон о потребкредите, а на ст. 32 Закона о защите прав потребителей. Отказаться всё равно можно, но исполнитель вправе удержать реально понесённые расходы."
    - when: "with_credit and in_app == 'unknown'"
      text: "Загляните в заявление-анкету на кредит. Если услуга там указана и с оформления прошло не больше 30 дней, лучше исправить ответ на «Да» — тогда деньги вернут за 7 рабочих дней, а если исполнитель не заплатит, их обязан вернуть банк."
    - when: "place == 'car'"
      text: "Проверьте договор купли-продажи машины: если скидка на автомобиль была дана при условии покупки этой услуги, салон может потребовать скидку назад. Верховный Суд в таких спорах встаёт на сторону покупателя, но риск стоит знать заранее."
  template: |
    > Кому: {{ executor_name }}
    {% if executor_inn %}
    > ИНН {{ executor_inn }}
    {% endif %}
    > {{ executor_address }}
    {% if with_credit %}
    > Копия: {{ bank_name }}
    {% endif %}
    >
    > От: {{ fio }}
    > {{ address }}
    > Тел.: {{ phone }}{% if email %}, e-mail: {{ email }}{% endif %}

    # ЗАЯВЛЕНИЕ
    ## об отказе от дополнительной услуги и возврате уплаченных денежных средств

    {{ date(contract_date) }}{% if place == 'car' %} при покупке автомобиля{% endif %} мной оформлена дополнительная услуга: {{ service }} (далее — Услуга). Исполнитель Услуги — {{ executor_name }}.{% if with_credit %} Услуга оформлена в связи с заключением договора потребительского кредита {{ credit_contract }} с {{ bank_name }}.{% endif %} Стоимость Услуги в размере {{ money(price) }} руб. оплачена{% if with_credit %}, в том числе за счёт кредитных средств{% endif %}.

    {% if credit_law %}
    В соответствии с ч. 2.7 ст. 7 Федерального закона от 21.12.2013 № 353-ФЗ «О потребительском кредите (займе)» (далее — Закон о потребительском кредите) заёмщик вправе в течение тридцати календарных дней со дня выражения согласия на оказание дополнительной услуги отказаться от неё и потребовать возврата уплаченных за неё денежных средств за вычетом стоимости части услуги, фактически оказанной до дня получения заявления об отказе. Тридцатидневный срок мной соблюдён. Денежные средства подлежат возврату в срок, не превышающий семи рабочих дней со дня получения заявления (ч. 2.9 ст. 7 Закона о потребительском кредите).

    Кроме того, в соответствии со ст. 32 {{ law }} и п. 1 ст. 782 Гражданского кодекса РФ потребитель вправе отказаться от исполнения договора об оказании услуг в любое время при условии оплаты исполнителю фактически понесённых им расходов.
    {% else %}
    В соответствии со ст. 32 {{ law }} и п. 1 ст. 782 Гражданского кодекса РФ потребитель вправе отказаться от исполнения договора об оказании услуг в любое время при условии оплаты исполнителю фактически понесённых им расходов, связанных с исполнением обязательств по договору. Условия, препятствующие реализации этого права, в том числе о невозврате платы, ничтожны (п. 1, пп. 3 п. 2 ст. 16 Закона).
    {% endif %}

    {% if form_type == 'abonent' %}
    Оформление Услуги в виде абонентского договора не лишает меня права на возврат: при отказе от абонентского договора потребитель вправе требовать возврата денежных сумм, уплаченных за период, на который договор досрочно прекращён (п. 10 Обзора судебной практики по делам о защите прав потребителей, утв. Президиумом Верховного Суда РФ 18.10.2023).
    {% elif form_type == 'option' %}
    Оформление Услуги в виде опционного договора не лишает меня права на возврат: условие о невозврате опционного платежа при отказе потребителя от договора недействительно как ущемляющее права потребителя (п. 11 Обзора судебной практики по делам о защите прав потребителей, утв. Президиумом Верховного Суда РФ 18.10.2023).
    {% elif form_type == 'guarantee' %}
    Оформление Услуги в виде независимой гарантии не лишает меня права на возврат: договор о предоставлении независимой гарантии, заключённый потребителем, является договором возмездного оказания услуг, и потребитель вправе отказаться от него с оплатой лишь фактически понесённых исполнителем расходов (Определение Судебной коллегии по гражданским делам Верховного Суда РФ от 28.11.2023 № 47-КГ23-7-К6).
    {% endif %}

    {% if used %}
    Услуга оказана мне лишь в незначительной части; стоимость фактически оказанной части подлежит подтверждению исполнителем.
    {% else %}
    Услуги по договору мне не оказывались, исполнитель фактических расходов, связанных с исполнением договора, не понёс.
    {% endif %}

    На основании изложенного отказываюсь от Услуги и прошу:
    ~ 1. Вернуть уплаченные за Услугу денежные средства в размере {{ money(price) }} руб.{% if used %} за вычетом стоимости фактически оказанной части Услуги, подтверждённой документами,{% endif %} в срок, не превышающий {% if credit_law %}семи рабочих дней со дня получения настоящего заявления (ч. 2.9 ст. 7 Закона о потребительском кредите){% else %}семи дней со дня получения настоящего заявления (п. 2 ст. 314 Гражданского кодекса РФ){% endif %}, по реквизитам: {{ refund_details }}.
    ~ 2. В случае удержания какой-либо суммы — представить документы, подтверждающие фактически понесённые расходы.

    В случае невозврата денежных средств я обращусь в суд с требованием о взыскании уплаченной суммы, процентов за пользование чужими денежными средствами (ст. 395 Гражданского кодекса РФ), компенсации морального вреда (ст. 15 Закона) и штрафа (п. 6 ст. 13 Закона), а также направлю жалобы в Роспотребнадзор{% if with_credit %} и Банк России{% endif %}.

    Ответ прошу направить по адресу, указанному выше{% if email %}, или на e-mail {{ email }}{% endif %}.

    ~ Приложения:
    ~ 1. Копия сертификата (договора, заявления о присоединении) на Услугу.
    ~ 2. Копия документа об оплате{% if with_credit %} или выписка по кредиту{% endif %}.
    {% if with_credit %}
    ~ 3. Копия заявления о предоставлении кредита.
    {% endif %}

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  after: |
    <b>Как отправить — не тяните</b>
    1. Отправьте заявление <b>исполнителю</b> (компании из сертификата) заказным письмом с описью вложения и уведомлением. Продублируйте на e-mail из договора или оферты.
    2. Сохраните квитанции и опись: от даты получения считаются сроки.
    {% if with_credit %}Копию отдайте в банк — в отделении под отметку или через его приёмную обращений.
    {% endif %}{% if place == 'car' %}Копию отправьте автосалону: по позиции Конституционного Суда (Постановление от 21.04.2026 № 25-П) продавец может отвечать за возврат вместе с партнёром, если договор заключали при его посредничестве.
    {% endif %}
    {% if credit_law %}Исполнитель должен вернуть деньги за 7 рабочих дней. Не вернул — с 31-го по 180-й день после заявления требуйте деньги с банка (ч. 2.10 ст. 7 закона о потребкредите), банк возвращает за 7 рабочих дней. Банк отказал — финансовый уполномоченный (finombudsman.ru) и Банк России (cbr.ru), бесплатно.{% else %}Срок возврата — 7 дней с получения заявления. Не вернули — жалоба в Роспотребнадзор{% if with_credit %} и Банк России (cbr.ru){% endif %} и иск по месту вашего жительства: госпошлину потребители не платят по искам до 1 млн ₽.{% endif %}
  followups:
    - days: 12
      text: "Прошло 12 дней с отказа от «{{ service }}». Деньги вернули? Если нет — следующий шаг: жалоба в Роспотребнадзор{% if with_credit %}, а по кредитной допуслуге — требование к банку по ч. 2.10 ст. 7 закона о потребкредите{% endif %}."
      offer: zhaloba_rpn

