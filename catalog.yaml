- id: obmen_25
  category: pokupki
  title: "Заявление: вернуть или обменять товар, который не подошёл"
  button: "Не подошёл (в магазине)"
  price: 290
  verified: false
  filename: "Заявление_обмен_возврат.docx"
  sections:
    - {title: "Покупка", keys: [item, price, buy_date, reason, condition_ok]}
    - {title: "Продавец", keys: [seller_name, seller_address]}
  short: "Купили в обычном магазине, товар целый, но не подошёл размер, цвет, фасон. Даётся 14 дней."
  gives: "Заявление по ст. 25 Закона о защите прав потребителей: обмен, а если аналога нет — возврат денег за 3 дня."
  basis: ["Закон РФ «О защите прав потребителей»: ст. 25", "Постановление Правительства РФ от 31.12.2020 № 2463 (перечень товаров, которые не обмениваются)"]
  questions:
    - key: item
      type: text
      q: "Что за товар? Название и артикул, как в чеке."
      example: "Куртка женская, арт. 12345, размер 44"
    - key: price
      type: money
      q: "Сколько заплатили, в рублях?"
      example: "7990"
    - key: buy_date
      type: date
      past: true
      q: "Дата покупки. Формат ДД.ММ.ГГГГ."
      example: "-5d"
    - key: reason
      type: choice
      q: "Почему не подошёл?"
      options:
        - {v: "размеру", label: "Размер"}
        - {v: "форме", label: "Форма, фасон"}
        - {v: "расцветке", label: "Цвет"}
        - {v: "габаритам", label: "Габариты"}
        - {v: "комплектации", label: "Комплектация"}
      example: "размеру"
    - key: condition_ok
      type: yesno
      q: "Товар не носили и не использовали, бирки и ярлыки на месте, чек или другое доказательство покупки есть?"
      example: true
    - key: seller_name
      type: text
      q: "Название продавца, как в чеке."
      example: "ООО «Мода»"
    - key: seller_address
      type: text
      q: "Адрес магазина."
      example: "123000, г. Москва, ул. Тверская, д. 10"
    - use: person
  warnings:
    - when: "days_since(buy_date) > 14"
      block: true
      text: "По закону на обмен товара, который просто не подошёл, даётся 14 дней, не считая дня покупки. Этот срок прошёл, поэтому документ вам не поможет. Если в товаре есть брак, выберите «Товар с браком»."
    - when: "not condition_ok"
      block: true
      text: "Обменять можно только товар, который не использовали, с сохранённым товарным видом и ярлыками. Если в товаре есть брак, выберите «Товар с браком» — там правила другие."
    - when: "true"
      text: "Проверьте: бельё, чулочно-носочные изделия, парфюмерию, косметику, лекарства, ювелирку и технически сложные товары по этой причине не меняют (перечень утверждён Постановлением Правительства № 2463)."
  template: |
    > Кому: {{ seller_name }}
    > {{ seller_address }}
    >
    > От: {{ fio }}
    > {{ address }}
    > Тел.: {{ phone }}{% if email %}, e-mail: {{ email }}{% endif %}

    # ЗАЯВЛЕНИЕ
    ## об обмене товара надлежащего качества

    {{ date(buy_date) }} в вашем магазине мной был приобретён товар: {{ item }} (далее — Товар) стоимостью {{ money(price) }} руб.

    Товар не подошёл по {{ reason }}. Товар не был в употреблении, сохранены его товарный вид, потребительские свойства, пломбы и фабричные ярлыки, а также документ, подтверждающий покупку.

    На основании ст. 25 Закона РФ от 07.02.1992 № 2300-1 «О защите прав потребителей» прошу обменять Товар на аналогичный товар другого {{ 'размера' if reason == 'размеру' else ('фасона' if reason == 'форме' else ('цвета' if reason == 'расцветке' else ('габарита' if reason == 'габаритам' else 'комплекта'))) }} с перерасчётом цены при необходимости.

    Если аналогичный товар отсутствует в продаже, в соответствии с п. 2 ст. 25 Закона прошу принять отказ от исполнения договора купли-продажи и вернуть уплаченную сумму {{ money(price) }} руб. в течение трёх дней со дня возврата Товара.

    ~ Приложения:
    ~ 1. Копия кассового чека (иного документа об оплате).

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  after: |
    <b>Что делать</b>
    1. Распечатайте 2 экземпляра, подпишите.
    2. Принесите в магазин вместе с товаром и чеком. На вашем экземпляре попросите отметку о приёме: дата, подпись, должность.
    3. Последний день срока: <b>{{ date(add_days(buy_date, 14)) }}</b>. Не откладывайте.
