- id: zarplata
  category: rabota
  title: "Требование выплатить долг по зарплате с компенсацией"
  button: "Задержали зарплату"
  price: 390
  verified: false
  filename: "Требование_выплата_зарплаты.docx"
  sections:
    - {title: "Работодатель", keys: [employer, employer_address, position, fired]}
    - {title: "Долг", keys: [debt, due_date, suspend]}
  short: "Задерживают зарплату или не выплатили расчёт при увольнении. Считаем компенсацию за каждый день."
  gives: "Письменное требование по ст. 136, 140, 236 ТК РФ с расчётом компенсации и, если нужно, уведомление о приостановке работы (ст. 142)."
  basis: ["Трудовой кодекс РФ: ст. 136, 140, 142, 236, 392"]
  computed:
    days: "days_since(due_date)"
    comp: "debt * key_rate / 100 / 150 * days_since(due_date)"
  questions:
    - key: employer
      type: text
      q: "Работодатель: название компании или ИП."
      example: "ООО «Ромашка»"
    - key: employer_address
      type: text
      q: "Адрес работодателя."
      example: "123000, г. Москва, ул. Лесная, д. 2"
    - key: position
      type: text
      q: "Ваша должность."
      example: "менеджер по продажам"
    - key: fired
      type: yesno
      q: "Вы уже уволены и не получили расчёт?"
      example: false
    - key: debt
      type: money
      q: "Сколько вам должны, в рублях (на руки, после налога)?"
      example: "85000"
    - key: due_date
      type: date
      past: true
      q: "Когда должны были заплатить? Дата выплаты по договору или день увольнения. ДД.ММ.ГГГГ."
      example: "-40d"
    - key: suspend
      type: yesno
      when: "not fired and days_since(due_date) > 15"
      q: "Задержка больше 15 дней. Хотите письменно уведомить, что приостанавливаете работу до выплаты? (законно по ст. 142 ТК, зарплата за это время сохраняется)"
      example: true
    - use: person
  warnings:
    - when: "days_since(due_date) > 330"
      text: "С даты выплаты прошло почти год. В суд по невыплате зарплаты нужно обратиться в течение 1 года (ст. 392 ТК РФ). Не затягивайте."
  template: |
    > {{ 'Бывшему работодателю' if fired else 'Работодателю' }}: {{ employer }}
    > {{ employer_address }}
    >
    > От: {{ fio }}
    > {{ 'бывший работник, ' if fired else '' }}{{ position }}
    > {{ address }}
    > Тел.: {{ phone }}{% if email %}, e-mail: {{ email }}{% endif %}

    # ТРЕБОВАНИЕ
    ## о выплате задолженности по заработной плате и компенсации за задержку

    {% if fired %}В соответствии со ст. 140 Трудового кодекса РФ при прекращении трудового договора выплата всех сумм, причитающихся работнику, производится в день увольнения. {{ date(due_date) }} трудовой договор со мной прекращён, однако окончательный расчёт в размере {{ money(debt) }} руб. до настоящего времени не произведён.{% else %}В соответствии со ст. 136 Трудового кодекса РФ заработная плата выплачивается не реже чем каждые полмесяца в установленные дни. Заработная плата в размере {{ money(debt) }} руб., подлежавшая выплате {{ date(due_date) }}, мне до настоящего времени не выплачена.{% endif %}

    В соответствии со ст. 236 Трудового кодекса РФ при нарушении срока выплаты заработной платы работодатель обязан выплатить её с уплатой процентов (денежной компенсации) в размере не ниже 1/150 ключевой ставки Центрального банка РФ от невыплаченной суммы за каждый день задержки. По состоянию на {{ date(today) }} задержка составляет {{ days }} дн., размер компенсации — не менее {{ money(comp) }} руб. (ориентировочный расчёт по ключевой ставке {{ key_rate_text }}% годовых; окончательная сумма рассчитывается по ставкам, действовавшим в каждый период задержки).

    Требую незамедлительно выплатить задолженность в размере {{ money(debt) }} руб. и компенсацию за задержку, начисленную по день фактической выплаты включительно.
    {% if suspend %}

    Также уведомляю, что в соответствии с ч. 2 ст. 142 Трудового кодекса РФ в связи с задержкой выплаты заработной платы на срок более 15 дней я приостанавливаю работу на весь период до выплаты задержанной суммы, начиная со дня, следующего за днём вручения настоящего уведомления. За период приостановления работы за мной сохраняется средний заработок (ч. 4 ст. 142 ТК РФ).
    {% endif %}

    В случае невыплаты я буду вынужден(а) обратиться в Государственную инспекцию труда, прокуратуру и суд с требованием о взыскании задолженности, компенсации за задержку и компенсации морального вреда (ст. 237 ТК РФ).

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  vars:
    key_rate_text: "{{ fmt_rate(key_rate) }}"
  after: |
    <b>Как вручить</b>
    1. Распечатайте 2 экземпляра. Один отдайте под отметку о приёме на своём (дата, подпись, должность принявшего). Не берут — заказное письмо с описью.
    {% if suspend %}2. <b>Важно:</b> приостанавливать работу можно только со следующего дня после вручения уведомления. До вручения — выходите на работу, иначе могут оформить прогул.
    {% endif %}
    Компенсация посчитана по текущей ключевой ставке — это ориентир; точную сумму считает бухгалтерия или суд.
    Не заплатили — жалоба в трудовую инспекцию (онлайнинспекция.рф) и суд. Работники не платят госпошлину по трудовым спорам.
  followups:
    - days: 7
      text: "Прошла неделя с требования о зарплате. Заплатили? Если нет — напишите жалобу в трудовую инспекцию через онлайнинспекция.рф или Госуслуги и готовьтесь к суду (срок — 1 год с даты выплаты)."

