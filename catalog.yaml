- id: kollektory
  category: dengi
  title: "Заявление должника об отказе от взаимодействия с кредитором и коллекторами"
  button: "Достали коллекторы"
  price: 390
  verified: false
  filename: "Заявление_отказ_от_взаимодействия.docx"
  sections:
    - {title: "Долг", keys: [mode, creditor_name, creditor_address, collector_name, collector_address, debt_doc, overdue_since]}
    - {title: "Представитель", keys: [rep_fio, rep_reg, rep_phone, rep_email, rep_address]}
    - {title: "Ваши данные", keys: [fio, passport, passport_issued, reg_address, phone, email]}
  short: "Звонят и пишут по просроченному долгу. Через 4 месяца просрочки можно запретить звонки и сообщения — по закону."
  gives: "Заявление по ст. 8 закона № 230-ФЗ: отказ от звонков, встреч и сообщений или общение только через адвоката."
  basis: ["Федеральный закон от 03.07.2016 № 230-ФЗ «О защите прав и законных интересов физических лиц при осуществлении деятельности по возврату просроченной задолженности…»: ст. 4, 7, 8", "Приказ ФССП России от 18.01.2024 № 6 (форма заявления)"]
  questions:
    - key: mode
      type: choice
      label: "Что заявляем"
      q: "Что хотите заявить?"
      options:
        - {v: refuse, label: "Отказ от звонков, встреч и сообщений"}
        - {v: rep, label: "Общение только через моего адвоката"}
      example: refuse
    - key: creditor_name
      type: text
      label: "Кредитор"
      q: "Кому вы должны: банк или МФО (как в договоре)."
      example: "ООО МКК «Быстрые деньги»"
    - key: creditor_address
      type: text
      label: "Адрес кредитора"
      q: "Адрес кредитора (из договора или с сайта)."
      example: "123000, г. Москва, ул. Финансовая, д. 1"
    - key: collector_name
      type: text
      optional: true
      label: "Коллектор"
      q: "Если звонит коллекторское агентство — его название. Если нет или не знаете, отправьте «-»."
      example: "ООО ПКО «Взыскание»"
    - key: collector_address
      type: text
      when: "collector_name"
      label: "Адрес коллектора"
      q: "Адрес коллекторского агентства (есть в его письмах или на сайте)."
      example: "123001, г. Москва, ул. Долговая, д. 2"
    - key: debt_doc
      type: text
      label: "Договор"
      q: "Номер и дата договора, по которому долг (кредитный договор или договор займа)."
      example: "№ 2025-000123 от 15.03.2025"
    - key: overdue_since
      type: date
      when: "mode == 'refuse'"
      past: true
      label: "Просрочка с"
      q: "С какой даты просрочка? Примерно — дата первого пропущенного платежа. ДД.ММ.ГГГГ."
      why: "Отказаться от общения можно только через 4 месяца после начала просрочки. Раньше заявление не действует."
      example: "-200d"
    - key: rep_fio
      type: fio
      when: "mode == 'rep'"
      label: "Адвокат"
      q: "ФИО адвоката. Представителем по закону может быть только адвокат."
      example: "Смирнов Сергей Сергеевич"
    - key: rep_reg
      type: text
      when: "mode == 'rep'"
      label: "Номер в реестре адвокатов"
      q: "Регистрационный номер адвоката в реестре адвокатов (спросите у него)."
      example: "77/12345"
    - key: rep_phone
      type: text
      when: "mode == 'rep'"
      label: "Телефон адвоката"
      q: "Телефон адвоката."
      example: "+7 900 765-43-21"
    - key: rep_email
      type: text
      when: "mode == 'rep'"
      optional: true
      label: "E-mail адвоката"
      q: "E-mail адвоката. Если нет, отправьте «-»."
      example: "smirnov@advokat.ru"
    - key: rep_address
      type: text
      when: "mode == 'rep'"
      label: "Адрес адвоката"
      q: "Почтовый адрес адвоката."
      example: "123002, г. Москва, ул. Адвокатская, д. 4, оф. 5"
    - key: fio
      type: fio
      label: "ФИО"
      q: "Ваши фамилия, имя и отчество полностью."
      example: "Иванов Иван Иванович"
    - key: passport
      type: text
      label: "Паспорт"
      q: "Серия и номер паспорта. Этого требует форма заявления, иначе кредитор может его не принять."
      example: "4510 123456"
    - key: passport_issued
      type: text
      label: "Кем и когда выдан"
      q: "Кем и когда выдан паспорт (как в паспорте)."
      example: "ГУ МВД России по г. Москве, 12.05.2015"
    - key: reg_address
      type: text
      label: "Адрес регистрации"
      q: "Адрес регистрации (прописка) с индексом."
      example: "123456, г. Москва, ул. Садовая, д. 1, кв. 10"
    - key: phone
      type: text
      label: "Телефон"
      q: "Ваш номер телефона."
      example: "+7 900 123-45-67"
    - key: email
      type: text
      optional: true
      label: "E-mail"
      q: "E-mail. Если не нужен, отправьте «-»."
      example: "ivanov@mail.ru"
  vars:
    law: "Федерального закона от 03.07.2016 № 230-ФЗ «О защите прав и законных интересов физических лиц при осуществлении деятельности по возврату просроченной задолженности и о внесении изменений в Федеральный закон „О микрофинансовой деятельности и микрофинансовых организациях“» (далее — Закон)"
  warnings:
    - when: "mode == 'refuse' and days_since(overdue_since) < 123"
      block: true
      text: "С начала просрочки ещё не прошло 4 месяца. Заявление об отказе от общения, поданное раньше, по закону недействительно (ч. 6 ст. 8 закона № 230-ФЗ). Пока можно пожаловаться на слишком частые звонки: не больше 1 раза в сутки, 2 в неделю и 8 в месяц. Или выбрать вариант «только через адвоката» — он доступен сразу."
    - when: "true"
      text: "Честно: заявление не отменяет долг. Проценты и неустойка продолжают идти, а кредитор может обратиться в суд. Заявление запрещает звонки, встречи и сообщения, но не бумажные письма."
  template: |
    > Кому: {{ creditor_name }}
    > {{ creditor_address }}
    {% if collector_name %}
    >
    > {{ collector_name }}
    > {{ collector_address }}
    {% endif %}
    >
    > От: {{ fio }}
    > {{ reg_address }}
    > Тел.: {{ phone }}{% if email %}, e-mail: {{ email }}{% endif %}

    # ЗАЯВЛЕНИЕ
    ## должника {% if mode == 'refuse' %}об отказе от взаимодействия{% else %}об осуществлении взаимодействия только через представителя{% endif +%}

    ~ Сведения о должнике:
    ~ фамилия, имя, отчество: {{ fio }};
    ~ документ, удостоверяющий личность: паспорт гражданина Российской Федерации {{ passport }}, выдан {{ passport_issued }};
    ~ адрес регистрации: {{ reg_address }};
    ~ телефон: {{ phone }}{% if email %}; адрес электронной почты: {{ email }}{% endif %}.

    ~ Сведения о задолженности: договор {{ debt_doc }}, кредитор — {{ creditor_name }}.

    {% if mode == 'refuse' %}
    На основании п. 2 ч. 1 ст. 8 {{ law }} заявляю об отказе от взаимодействия с кредитором и (или) представителем кредитора по указанному обязательству способами, предусмотренными пунктами 1 и 2 части 1 статьи 4 Закона: личные встречи, телефонные переговоры (в том числе с использованием автоматизированного интеллектуального агента), текстовые, голосовые и иные сообщения, передаваемые по сетям электросвязи.

    Просрочка исполнения обязательства возникла {{ date(overdue_since) }}, то есть более чем за четыре месяца до направления настоящего заявления (ч. 6 ст. 8 Закона).

    Прошу учесть, что по истечении трёх рабочих дней после дня получения настоящего заявления кредитор и его представитель не вправе по собственной инициативе осуществлять взаимодействие со мной указанными способами (ч. 7 ст. 8 Закона).
    {% else %}
    На основании п. 1 ч. 1 ст. 8 {{ law }} заявляю, что взаимодействие со мной по указанному обязательству должно осуществляться только через моего представителя — адвоката:
    ~ фамилия, имя, отчество: {{ rep_fio }};
    ~ регистрационный номер в реестре адвокатов: {{ rep_reg }};
    ~ телефон: {{ rep_phone }}{% if rep_email %}; адрес электронной почты: {{ rep_email }}{% endif %};
    ~ почтовый адрес: {{ rep_address }}.

    С момента получения настоящего заявления кредитор и его представитель вправе осуществлять взаимодействие только с указанным представителем (ч. 5 ст. 8 Закона).
    {% endif %}

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  after: |
    <b>Как отправить, чтобы заявление действовало</b>
    1. Распечатайте {% if collector_name %}2 экземпляра и отправьте каждому адресату — и кредитору, и коллектору{% else %}и отправьте кредитору{% endif %} <b>заказным письмом с уведомлением о вручении</b> (лучше с описью вложения). Другие законные способы — вручить под расписку на вашей копии или через нотариуса. Через Госуслуги это заявление не подают.
    2. Сохраните квитанции, опись и уведомление о вручении: от даты получения считается срок.
    {% if mode == 'refuse' %}3. Через 3 рабочих дня после получения звонки, встречи и сообщения должны прекратиться. Письма по почте приходить могут. Если по долгу будет решение суда, действие заявления приостанавливается на 2 месяца.
    {% else %}3. Согласуйте заявление с адвокатом до отправки: все вопросы по долгу пойдут через него.
    {% endif %}Звонят дальше — жалоба в ФССП (на коллекторов, через сайт ФССП или Госуслуги) или в Банк России (cbr.ru, если звонит банк или МФО). Это бесплатно. Сохраняйте записи звонков и скриншоты.
    Долг при этом никуда не исчезает. Если платить нечем, спросите кредитора о реструктуризации или узнайте условия внесудебного банкротства через МФЦ.
  followups:
    - days: 14
      text: "Прошло 2 недели с заявления кредитору «{{ creditor_name }}». Звонки прекратились? Если нет — пожалуйтесь в ФССП (коллекторы) или в Банк России (банки и МФО), приложив квитанцию об отправке и записи звонков."

