- id: usluga
  category: pokupki
  title: "Претензия: услугу сделали плохо"
  button: "Плохая услуга, ремонт"
  price: 390
  verified: false
  filename: "Претензия_некачественная_услуга.docx"
  sections:
    - {title: "Услуга", keys: [service, contract_date, contract_no, price, defect]}
    - {title: "Требование", keys: [demand, fix_days, discount_sum, refund_ground]}
    - {title: "Исполнитель", keys: [executor_name, executor_address]}
  short: "Ремонт, химчистка, салон, ателье, установка — сделали плохо или с дефектом."
  gives: "Претензия по ст. 29 и 31 Закона о защите прав потребителей: переделать, снизить цену или вернуть деньги."
  basis: ["Закон РФ «О защите прав потребителей»: ст. 13, 15, 28, 29, 31"]
  questions:
    - key: service
      type: text
      q: "Какую услугу или работу заказывали?"
      example: "ремонт стиральной машины LG (замена подшипника)"
    - key: contract_date
      type: date
      past: true
      q: "Дата договора или заказа. ДД.ММ.ГГГГ."
      example: "-20d"
    - key: contract_no
      type: text
      optional: true
      q: "Номер договора, квитанции или наряда. Если нет, отправьте «-»."
      example: "0457"
    - key: price
      type: money
      q: "Сколько заплатили, в рублях?"
      example: "8500"
    - key: defect
      type: long
      q: "Что не так с результатом? 1–2 предложения."
      example: "через три дня после ремонта машина снова гудит и протекает при отжиме"
    - key: demand
      type: choice
      q: "Что требуем?"
      options:
        - {v: fix, label: "Бесплатно исправить"}
        - {v: discount, label: "Снизить цену"}
        - {v: refund, label: "Вернуть деньги"}
      example: fix
    - key: fix_days
      type: int
      when: "demand == 'fix'"
      q: "За сколько дней должны исправить? Обычно ставят 10."
      example: "10"
    - key: discount_sum
      type: money
      when: "demand == 'discount'"
      q: "На сколько рублей снизить цену?"
      example: "3000"
    - key: refund_ground
      type: choice
      when: "demand == 'refund'"
      q: "Деньги можно вернуть, если недостатки серьёзные или их не исправили в срок. Что у вас?"
      options:
        - {v: essential, label: "Недостатки серьёзные"}
        - {v: not_fixed, label: "Просили исправить, не исправили в срок"}
        - {v: none, label: "Ни то, ни другое"}
      example: essential
    - key: executor_name
      type: text
      q: "Исполнитель: название компании или ИП."
      example: "ИП Кузнецов К. К."
    - key: executor_address
      type: text
      q: "Адрес исполнителя."
      example: "123000, г. Москва, ул. Мастеров, д. 7"
    - use: person
  warnings:
    - when: "demand == 'refund' and refund_ground == 'none'"
      block: true
      text: "Сразу вернуть деньги за услугу можно только при серьёзных недостатках или если их не исправили в срок. Выберите «Бесплатно исправить» и дайте срок. Если не исправят — возвращайтесь за возвратом денег."
  template: |
    > Кому: {{ executor_name }}
    > {{ executor_address }}
    >
    > От: {{ fio }}
    > {{ address }}
    > Тел.: {{ phone }}{% if email %}, e-mail: {{ email }}{% endif %}

    # ПРЕТЕНЗИЯ
    ## о недостатках оказанной услуги (выполненной работы)

    {{ date(contract_date) }} между мной и {{ executor_name }} заключён договор{% if contract_no %} (№ {{ contract_no }}){% endif %}, по которому исполнитель обязался выполнить: {{ service }}. Стоимость работ в размере {{ money(price) }} руб. оплачена мной полностью.

    Работа выполнена с недостатками: {{ defect }}.

    {% if demand == 'fix' %}
    В соответствии с п. 1 ст. 29 Закона РФ от 07.02.1992 № 2300-1 «О защите прав потребителей» (далее — Закон) требую безвозмездно устранить недостатки выполненной работы в срок {{ fix_days }} дней со дня предъявления настоящей претензии.
    {% elif demand == 'discount' %}
    В соответствии с п. 1 ст. 29 и п. 1 ст. 31 Закона РФ от 07.02.1992 № 2300-1 «О защите прав потребителей» (далее — Закон) требую соразмерно уменьшить цену выполненной работы на {{ money(discount_sum) }} руб. и вернуть эту сумму в течение 10 дней со дня предъявления настоящей претензии.
    {% else %}
    {% if refund_ground == 'essential' %}Выявленные недостатки являются существенными.{% else %}Моё требование об устранении недостатков в установленный срок не выполнено.{% endif %} В соответствии с п. 1 ст. 29 и п. 1 ст. 31 Закона РФ от 07.02.1992 № 2300-1 «О защите прав потребителей» (далее — Закон) отказываюсь от исполнения договора и требую вернуть уплаченную сумму {{ money(price) }} руб. в течение 10 дней со дня предъявления настоящей претензии.
    {% endif %}

    За нарушение сроков удовлетворения требований потребителя Закон предусматривает неустойку в размере 3% цены работы за каждый день просрочки (п. 3 ст. 31, п. 5 ст. 28 Закона). Если требование не будет выполнено, я обращусь в суд с требованием о взыскании неустойки, компенсации морального вреда (ст. 15 Закона) и штрафа в размере 50% от присуждённой суммы (п. 6 ст. 13 Закона).

    Ответ прошу направить по адресу, указанному выше{% if email %}, или на e-mail {{ email }}{% endif %}.

    ~ Приложения:
    ~ 1. Копия договора (квитанции, наряда).
    ~ 2. Копия документа об оплате.
    ~ 3. Фото недостатков (при наличии).

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  after: |
    <b>Как отправить</b>
    1. Распечатайте 2 экземпляра и подпишите.
    2. Отдайте исполнителю под отметку о приёме на вашем экземпляре или отправьте заказным письмом с описью.
    3. Сфотографируйте недостатки до того, как отдадите вещь обратно.
    Срок ответа — 10 дней{% if demand == 'fix' %}, на исправление — {{ fix_days }} дней{% endif %}. Когда отметите отправку, я напомню проверить ответ.
  followups:
    - days: 12
      text: "Прошло 12 дней с претензии за «{{ service }}». Если исполнитель молчит — следующий шаг: жалоба в Роспотребнадзор."
      offer: zhaloba_rpn

