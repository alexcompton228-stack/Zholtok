    ## о возврате обеспечительного платежа по договору найма жилого помещения

    {{ date(contract_date) }} между мной и Вами заключён договор найма жилого помещения по адресу: {{ flat }}. При заключении договора мной был внесён обеспечительный платёж (залог) в размере {{ money(deposit) }} руб.

    {{ date(moveout) }} договор прекращён, квартира и ключи возвращены{% if act %}, что подтверждается подписанным сторонами актом возврата{% endif %}. Задолженности по оплате найма и коммунальных услуг у меня нет.
    {% if excuse == 'damage' %}

    Ссылки на повреждения квартиры считаю необоснованными: {% if act %}в акте возврата повреждения не отражены{% else %}повреждения при возврате квартиры не фиксировались и документально не подтверждены{% endif %}. Нормальный износ имущества не является основанием для удержания платежа.
    {% elif excuse == 'early' %}

    Досрочное прекращение договора само по себе не является основанием для удержания обеспечительного платежа, если иное прямо не предусмотрено договором.
    {% endif %}

    Согласно п. 2 ст. 381.1 Гражданского кодекса РФ при прекращении обеспеченного обязательства обеспечительный платёж подлежит возврату, если иное не предусмотрено соглашением сторон. Удержание денежных средств без законных оснований является неосновательным обогащением (ст. 1102 ГК РФ).

    Требую вернуть обеспечительный платёж в размере {{ money(deposit) }} руб. в течение 10 календарных дней со дня получения настоящего требования.

    В противном случае я обращусь в суд с иском о взыскании суммы обеспечительного платежа, процентов за пользование чужими денежными средствами (ст. 395 ГК РФ) и судебных расходов.

    = {{ date(today) }} | ____________ / {{ short(fio) }}
