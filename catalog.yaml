# ---------------------------------------------------------------------
- id: vozvrat_brak
  category: pokupki
  title: "Претензия: возврат денег за товар с браком"
  button: "Товар с браком"
  price: 390
  verified: false
  filename: "Претензия_возврат_за_брак.docx"
  sections:
    - {title: "Покупка", keys: [item, price, buy_date, channel, tech_complex, essential, defect, proof]}
    - {title: "Требование", keys: [demand, refund_method, refund_details]}
    - {title: "Продавец", keys: [seller_name, seller_address, seller_inn]}
  short: "Сломалось, не работает, пришло с дефектом. Требуем вернуть деньги или заменить товар."
  gives: "Претензия продавцу по ст. 18 и 22 Закона о защите прав потребителей + инструкция, как отправить, + напоминание о сроке ответа после того, как вы отметите отправку."
  basis: ["Закон РФ «О защите прав потребителей»: ст. 13, 15, 18, 19, 21, 22, 23"]
  computed:
    days: "days_since(buy_date)"
  questions:
    - key: item
      type: text
      q: "Что за товар? Название и модель, как в чеке."
      example: "Смартфон Xiaomi Redmi Note 13, 256 ГБ"
    - key: price
      type: money
      q: "Сколько заплатили, в рублях?"
      example: "24990"
    - key: buy_date
      type: date
      past: true
      q: "Дата покупки (или получения, если была доставка). Формат ДД.ММ.ГГГГ."
      example: "-9d"
    - key: channel
      type: choice
      q: "Где купили?"
      options:
        - {v: store, label: "В магазине"}
        - {v: online, label: "Онлайн / маркетплейс"}
      example: store
    - key: tech_complex
      type: yesno
      q: "Это технически сложный товар?"
      why: "Например: телефон, ноутбук, планшет, телевизор, стиральная машина, холодильник, пылесос, фотоаппарат, автомобиль."
      example: true
    - key: essential
      type: choice
      when: "tech_complex and days_since(buy_date) > 15"
      q: "Что из этого про вас?"
      why: "С покупки прошло больше 15 дней. Для техники деньги возвращают только в одном из этих случаев."
      options:
        - {v: essential, label: "Поломка серьёзная: не чинится, повторяется или ремонт почти как новый"}
        - {v: repair_long, label: "Отдали в ремонт, прошло больше 45 дней"}
        - {v: repair_30, label: "За год гарантии товар был в ремонтах больше 30 дней"}
        - {v: none, label: "Ничего из этого"}
      example: essential
    - key: defect
      type: long
      q: "Опишите поломку 1–2 предложениями. Что именно не так и когда появилось."
      example: "через неделю после покупки перестал заряжаться, при подключении зарядного устройства индикатор не загорается"
    - key: proof
      type: choice
      q: "Чем подтвердите покупку?"
      options:
        - {v: check, label: "Кассовый чек"}
        - {v: echeck, label: "Электронный чек / письмо"}
        - {v: order, label: "Номер заказа, скриншот"}
        - {v: bank, label: "Выписка из банка"}
      example: check
    - key: demand
      type: choice
      q: "Что требуем?"
      options:
        - {v: refund, label: "Вернуть деньги"}
        - {v: replace, label: "Заменить на такой же"}
      example: refund
    - key: refund_method
      type: choice
      when: "demand == 'refund'"
      q: "Куда вернуть деньги?"
      options:
        - {v: card, label: "На карту, с которой платили"}
        - {v: cash, label: "Наличными"}
        - {v: details, label: "По реквизитам (впишу)"}
      example: card
    - key: refund_details
      type: long
      when: "demand == 'refund' and refund_method == 'details'"
      q: "Реквизиты: банк, БИК, номер счёта, получатель."
      example: "ПАО Сбербанк, БИК 044525225, счёт 40817810000000000000, получатель Иванов Иван Иванович"
    - key: seller_name
      type: text
      q: "Название продавца, как в чеке. Например: ООО «Техномаркет» или ИП Петров П. П."
      example: "ООО «Техномаркет»"
    - key: seller_address
      type: text
      q: "Адрес продавца (юридический или магазина, указан в чеке или на сайте)."
      example: "123000, г. Москва, ул. Тверская, д. 5"
    - key: seller_inn
      type: text
      optional: true
      q: "ИНН продавца (есть в чеке). Если нет, отправьте «-»."
      example: "7700000000"
    - use: person
  warnings:
    - when: "tech_complex and days_since(buy_date) > 15 and essential == 'none'"
      block: true
      text: "Для техники после 15 дней с покупки закон разрешает вернуть деньги только при серьёзной поломке или затянутом ремонте. Сейчас документ вам не поможет, и продавать его мы не будем. Что делать: сдайте товар в гарантийный ремонт и возьмите акт приёма. Если ремонт затянется больше 45 дней, возвращайтесь: это прямое основание для возврата денег."
    - when: "days_since(buy_date) > 730"
      text: "С покупки прошло больше 2 лет. Если гарантия на товар закончилась, требовать с продавца сложнее (ст. 19 Закона). Если гарантия длиннее 2 лет, всё в порядке."
  template: |
    > Кому: {{ seller_name }}
    > {{ seller_address }}
    {% if seller_inn %}
    > ИНН {{ seller_inn }}
    {% endif %}
    >
    > От: {{ fio }}
    > {{ address }}
    > Тел.: {{ phone }}{% if email %}, e-mail: {{ email }}{% endif %}

    # ПРЕТЕНЗИЯ
    ## {{ 'о возврате денежных средств за товар ненадлежащего качества' if demand == 'refund' else 'о замене товара ненадлежащего качества' }}

    {{ date(buy_date) }} {{ 'дистанционным способом ' if channel == 'online' else '' }}мной был приобретён товар: {{ item }} (далее — Товар) стоимостью {{ money(price) }} руб. Покупка подтверждается: {{ proof_label | lower }}.

    В процессе использования в Товаре обнаружен недостаток: {{ defect }}. При продаже о недостатке не сообщалось.

    Согласно п. 1 ст. 18 Закона РФ от 07.02.1992 № 2300-1 «О защите прав потребителей» (далее — Закон) потребитель, которому продан товар ненадлежащего качества, вправе по своему выбору потребовать замены на товар этой же марки (модели, артикула) либо отказаться от исполнения договора купли-продажи и потребовать возврата уплаченной суммы.
    {% if tech_complex and days <= 15 %}
    Товар относится к технически сложным. Требование предъявлено в течение 15 дней со дня передачи Товара, поэтому оно подлежит удовлетворению при обнаружении любого недостатка (п. 1 ст. 18 Закона).
    {% elif tech_complex and essential == 'essential' %}
    Товар относится к технически сложным. Выявленный недостаток является существенным, что в силу п. 1 ст. 18 Закона даёт право на предъявление настоящего требования по истечении 15 дней со дня передачи Товара.
    {% elif tech_complex and essential == 'repair_long' %}
    Товар относится к технически сложным. Товар был передан для устранения недостатка, однако установленный ст. 20 Закона максимальный срок устранения недостатков (45 дней) нарушен, что в силу п. 1 ст. 18 Закона даёт право на предъявление настоящего требования.
    {% elif tech_complex and essential == 'repair_30' %}
    Товар относится к технически сложным. В течение года гарантийного срока Товар не мог использоваться в совокупности более тридцати дней вследствие неоднократного устранения его недостатков, что в силу п. 1 ст. 18 Закона даёт право на предъявление настоящего требования.
    {% endif %}

    На основании изложенного требую:
    {% if demand == 'refund' %}
    ~ 1. Принять мой отказ от исполнения договора купли-продажи и вернуть уплаченную за Товар сумму {{ money(price) }} руб. в течение 10 дней со дня получения настоящей претензии (ст. 22 Закона) {{ refund_text }}.
    {% else %}
    ~ 1. Заменить Товар на товар этой же марки (модели, артикула) в течение 7 дней со дня предъявления настоящего требования (ст. 21 Закона).
    {% endif %}
    ~ 2. В случае проведения проверки качества Товара провести её в моём присутствии, заранее сообщив о месте и времени по указанным контактам (п. 5 ст. 18 Закона).

    Товар будет возвращён продавцу по его требованию (п. 1 ст. 18 Закона). Если требования не будут удовлетворены в установленный срок, я обращусь в суд с требованием о взыскании неустойки в размере 1% цены Товара за каждый день просрочки (ст. 23 Закона), компенсации морального вреда (ст. 15 Закона) и штрафа в размере 50% от присуждённой суммы (п. 6 ст. 13 Закона), а также направлю жалобу в Роспотребнадзор.

    Ответ прошу направить по адресу, указанному выше{% if email %}, или на e-mail {{ email }}{% endif %}.

    ~ Приложения:
    ~ 1. Копия документа, подтверждающего покупку ({{ proof_label | lower }}).
    ~ 2. Фото или видео недостатка (при наличии).

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  vars:
    refund_text: "{% if refund_method == 'card' %}на банковскую карту, с которой производилась оплата{% elif refund_method == 'cash' %}наличными денежными средствами{% else %}по следующим реквизитам: {{ refund_details }}{% endif %}"
  after: |
    <b>Как отправить, чтобы это сработало</b>
    1. Распечатайте 2 экземпляра и подпишите оба.
    2. Отдайте один продавцу и попросите на вашем экземпляре дату, подпись и печать. Если не принимают — отправьте <b>заказным письмом с описью вложения и уведомлением</b> на адрес из чека. Сохраните квитанцию и опись.
    {% if channel == 'online' %}3. Для маркетплейса продублируйте претензию в чат с продавцом и в поддержку, но бумажное письмо всё равно отправьте — это доказательство для суда.
    {% endif %}
    Срок ответа — 10 дней с момента, когда продавец получил претензию. Когда отметите отправку, я напомню проверить ответ.
  followups:
    - days: 12
      text: "Прошло 12 дней с претензии по товару «{{ item }}». Деньги вернули? Если нет — следующий шаг: жалоба в Роспотребнадзор, а потом суд с неустойкой 1% в день и штрафом 50%."
      offer: zhaloba_rpn

