- id: zalog_arenda
  category: zhile
  title: "Требование вернуть залог за квартиру"
  button: "Не отдают залог"
  price: 390
  verified: false
  filename: "Требование_возврат_залога.docx"
  sections:
    - {title: "Квартира и хозяин", keys: [landlord, landlord_address, flat, contract_date]}
    - {title: "Залог", keys: [deposit, moveout, act, excuse]}
  short: "Съехали, а хозяин не отдаёт залог (обеспечительный платёж) или удерживает его без причины."
  gives: "Досудебное требование по ст. 381.1 ГК РФ с процентами по ст. 395 ГК РФ."
  basis: ["Гражданский кодекс РФ: ст. 309, 310, 381.1, 395, 1102"]
  questions:
    - key: landlord
      type: fio
      q: "ФИО хозяина квартиры (как в договоре)."
      example: "Петров Пётр Петрович"
    - key: landlord_address
      type: text
      optional: true
      q: "Адрес хозяина для письма (если знаете). Если нет, отправьте «-» — укажем адрес квартиры."
      example: "-"
    - key: flat
      type: text
      q: "Адрес квартиры, которую вы снимали."
      example: "г. Москва, ул. Зелёная, д. 5, кв. 12"
    - key: contract_date
      type: date
      past: true
      q: "Дата договора аренды (найма). ДД.ММ.ГГГГ."
      example: "-400d"
    - key: deposit
      type: money
      q: "Сумма залога, в рублях."
      example: "50000"
    - key: moveout
      type: date
      past: true
      q: "Когда съехали и вернули ключи? ДД.ММ.ГГГГ."
      example: "-20d"
    - key: act
      type: yesno
      q: "Подписали акт возврата квартиры?"
      example: true
    - key: excuse
      type: choice
      q: "Что говорит хозяин?"
      options:
        - {v: silence, label: "Молчит или тянет"}
        - {v: damage, label: "Говорит, что есть повреждения"}
        - {v: early, label: "Говорит, что съехали раньше срока"}
      example: silence
    - use: person
  template: |
    > Кому: {{ landlord }}
    > {{ landlord_address or flat }}
    >
    > От: {{ fio }}
    > {{ address }}
    > Тел.: {{ phone }}{% if email %}, e-mail: {{ email }}{% endif %}

    # ТРЕБОВАНИЕ (ПРЕТЕНЗИЯ)
    ## о возврате обеспечительного платежа по договору найма жилого помещения

    {{ date(contract_date) }} между мной и Вами заключён договор найма жилого помещения по адресу: {{ flat }}. При заключении договора мной был внесён обеспечительный платёж (залог) в размере {{ money(deposit) }} руб.

    {{ date(moveout) }} договор прекращён, квартира и ключи возвращены{% if act %}, что подтверждается подписанным сторонами актом возврата{% endif %}. Задолженности по оплате найма и коммунальных услуг у меня нет.
    {% if excuse == 'damage' %}

    Ссылки на повреждения квартиры считаю необоснованными: {% if act %}в акте возврата повреждения не отражены{% else %}повреждения при возврате квартиры не фиксировались и документально не подтверждены{% endif %}. Нормальный износ имущества не является основанием для удержания платежа.
    {% elif excuse == 'early' %}

    Досрочное прекращение договора само по себе не является основанием для удержания обеспечительного платежа, если иное прямо не предусмотрено договором.
    {% endif %}

    Согласно п. 2 ст. 381.1 Гражданского кодекса РФ при прекращении обеспеченного обязательства обеспечительный платёж подлежит возврату, если иное не предусмотрено соглашением сторон. Удержание денежных средств без законных оснований является неосновательным обогащением (ст. 1102 ГК РФ).

    Требую вернуть обеспечительный платёж в размере {{ money(deposit) }} руб. в течение 10 календарных дней со дня получения настоящего требования.

    В противном случае я обращусь в суд с иском о взыскании суммы обеспечительного платежа, процентов за пользование чужими денежными средствами (ст. 395 ГК РФ) и судебных расходов.

    = {{ date(today) }} | ____________ / {{ short(fio) }}
  after: |
    <b>Как отправить</b>
    1. Сфотографируйте требование и отправьте хозяину в мессенджер — часто этого хватает.
    2. Параллельно отправьте заказным письмом с описью на его адрес (или на адрес квартиры). Сохраните квитанцию.
    3. Не вернёт за 10 дней — иск в суд: при сумме до 50 000 ₽ — к мировому судье, больше — в районный суд. Переписку, договор, акт и чеки сохраните.
  followups:
    - days: 12
      text: "Прошло 12 дней с требования о залоге. Вернули? Если нет — следующий шаг: иск в суд (при сумме до 50 000 ₽ — к мировому судье). Добавьте проценты по ст. 395 ГК РФ."

