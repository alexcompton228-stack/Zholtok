# =====================================================================
#  Желток — каталог документов (v0.1)
#  Всё содержимое бота живёт здесь: вопросы, шаблоны, инструкции, цены.
#  Код трогать не нужно, чтобы поправить текст или цену.
#
#  СТАТУС: verified: false у каждого документа = юрист ещё не проверял.
#  Цены — гипотеза для теста спроса.
#
#  Разметка шаблона (каждая строка = абзац в .docx):
#    > текст     — блок справа (шапка «Кому / От»)
#    # текст     — заголовок по центру, жирный
#    ## текст    — подзаголовок по центру
#    ### текст   — заголовок раздела слева, жирный
#    ~ текст     — абзац слева без отступа (списки, приложения)
#    = A | B     — строка подписи: A слева, B справа
#    пусто       — отступ между абзацами
#    остальное   — обычный абзац по ширине с красной строкой
#  Внутри — Jinja2: {{ поле }}, {% if %}, {% for %}.
# =====================================================================

