- id: zarplata
  category: rabota
  title: "Требование выплатить долг по зарплате с компенсацией"
  button: "Задержали зарплату"
  price: 390
  verified: false
  filename: "Требование_выплата_зарплаты.docx"
  sections:
    - {title: "Работодатель", keys: [employer, employer_address, position, fired]}
    - {title: "Долг", keys: [debt, due_date, suspend]}
  short: "Задерживают зарплату или не выплатили расчёт при увольнении. Считаем компенсацию за каждый день."
  gives: "Письменное требование по ст. 136, 140, 236 ТК РФ с расчётом компенсации и, если нужно, уведомление о приостановке работы (ст. 142)."
  basis: ["Трудовой кодекс РФ: ст. 136, 140, 142, 236, 392"]
  computed:
    days: "days_since(due_date)"
    comp: "debt * key_rate / 100 / 150 * days_since(due_date)"
  questions:
    - key: employer
      type: text
      q: "Работодатель: название компании или ИП."
      example: "ООО «Ромашка»"
    - key: employer_address
      type: text
      q: "Адрес работодателя."
      example: "123000, г. Москва, ул. Лесная, д. 2"
    - key: position
      type: text
      q: "Ваша должность."
      example: "менеджер по продажам"
    - key: fired
      type: yesno
      q: "Вы уже уволены и не получили расчёт?"
      example: false
    - key: debt
      type: money
      q: "Сколько вам должны, в рублях (на руки, после налога)?"
      example: "85000"
    - key: due_date
      type: date
      past: true
      q: "Когда должны были заплатить? Дата выплаты по договору или день увольнения. ДД.ММ.ГГГГ."
