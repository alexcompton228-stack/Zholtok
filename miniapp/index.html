<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Желток — Документы. По шагам.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
<div class="shell">

  <main id="app" class="screen" aria-live="polite">
    <p class="muted">Загружаем…</p>
  </main>
  <footer class="brandline" id="brandline">
    <img src="img/wordmark.png" alt="" width="64" height="11" class="brandline-mark" id="brandmark">
    <span>Документы. По шагам.</span>

</div>
<div class="cta-bar" id="ctabar" hidden>
